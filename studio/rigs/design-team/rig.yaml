version: "0.2"
name: design-1
summary: >
  Studio stage 3 and production support: the design team. A Claude creative
  director leads systems, feel, balance, UX, narrative, brevity-editing and
  art-and-audio seats to design the polished 1.0 and its product: pillars,
  product brief and scope, quality bar, feel spec with acceptance checks,
  every screen, Steam features, art and audio bible. Gates them with the
  owner, hands off to production, then stays on to answer design questions
  and judge discoveries. Brief: brief.md.

culture_file: CULTURE.md

docs:
  - path: brief.md
  - path: README.md

pods:
  - id: creative
    label: Creative direction
    members:
      - id: director
        label: "Creative director (Claude)"
        agent_ref: "local:agents/creative-director"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: design
    label: Game design
    members:
      - id: systems
        label: "Systems designer (Claude)"
        agent_ref: "local:agents/systems"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: balance
        label: "Balance designer (Codex)"
        agent_ref: "local:agents/balance"
        runtime: codex
        profile: default
        cwd: "."
      - id: feel
        label: "Feel designer (Claude)"
        agent_ref: "local:agents/feel"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: ux
        label: "UX designer (Claude)"
        agent_ref: "local:agents/ux"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: words
    label: Words
    members:
      - id: narrative
        label: "Narrative designer (Claude)"
        agent_ref: "local:agents/narrative"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: editor
        label: "Brevity editor (Codex)"
        agent_ref: "local:agents/editor"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

  - id: art
    label: Art and audio direction
    members:
      - id: director
        label: "Art and audio director (Codex)"
        agent_ref: "local:agents/art-director"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

edges:
  - kind: delegates_to
    from: creative.director
    to: design.systems
  - kind: delegates_to
    from: creative.director
    to: design.balance
  - kind: delegates_to
    from: creative.director
    to: design.feel
  - kind: delegates_to
    from: creative.director
    to: design.ux
  - kind: delegates_to
    from: creative.director
    to: words.narrative
  - kind: delegates_to
    from: creative.director
    to: words.editor
  - kind: delegates_to
    from: creative.director
    to: art.director
