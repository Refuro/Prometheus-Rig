<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f17" media="(prefers-color-scheme: dark)">
<title>Digest · Rig Console</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/notify.js"></script>
<script src="/health.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Daily digest, layer 1 (R-026, PL-053): one page per UTC day from data the console already reads
     (/api/digest). Read-only. Titles, log headings, operator lines and Lounge posts are agents' text: escaped. -->
<style>
:root{
  --paper:#eef1f4; --surface:#f7f9fb; --raised:#fff; --ink:#152033; --muted:#5d687a; --faint:#8a94a4;
  --line:#d7dde5; --signal:#c98200; --signal-soft:#fbf0d9; --cut:#c2412b; --ok:#2e9d62;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0a0f17; --surface:#0f1621; --raised:#141d2a; --ink:#e3e8ef; --muted:#8e9aac; --faint:#5d6a7e;
  --line:#212c3c; --signal:#f0b23c; --signal-soft:#2f2511; --cut:#f0765c; --ok:#3cb371;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.days a{font:600 12.5px var(--mono);color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raised)}
.days a[aria-current="page"]{color:var(--ink);border-color:var(--signal)}
.head{font-size:17px;font-weight:700;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
ul{margin:0;padding-left:18px}
li{margin:3px 0;overflow-wrap:anywhere}
.id{font:12px var(--mono);color:var(--faint)}
.k{display:inline-block;font:700 10.5px var(--font);letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--muted);margin-right:6px}
.k.incident{color:var(--cut)} .k.held{color:var(--signal)}
.none{color:var(--faint);font-size:13px}
a{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="/nav.js"></script>
<main>
  <h1>Digest</h1>
  <div class="sub">What happened on one day (UTC), from what the console already reads. Newest day first.</div>
  <div class="days" id="days"></div>
  <div id="out"><div class="none">Loading…</div></div>
</main>
<script>
(() => {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const $ = id => document.getElementById(id);
  const day = (new URLSearchParams(location.search).get("day") || "").replace(/[^0-9-]/g, "");
  const card = (t, body) => `<section class="card"><h2>${esc(t)}</h2>${body}</section>`;
  const list = (xs, fn, empty) => xs && xs.length ? `<ul>${xs.map(fn).join("")}</ul>` : `<div class="none">${esc(empty)}</div>`;
  async function load(){
    let d;
    try { d = await (await fetch(`/api/digest${day ? `?day=${day}` : ""}`, {cache: "no-store"})).json(); } catch { d = {error: "Couldn't reach the console"}; }
    if (!d || d.error) { $("out").innerHTML = `<div class="card">${esc(d && d.error)}</div>`; return; }
    $("days").innerHTML = d.days.map((x, i) => `<a href="?day=${esc(x)}"${x === d.day ? ' aria-current="page"' : ""}>${i === 0 ? "Today" : i === 1 ? "Yesterday" : esc(x.slice(5))}</a>`).join("");
    const a = d.activity || {}, op = d.operator || {};
    const opCounts = Object.entries(op.counts || {}).map(([k, n]) => `<span class="k ${esc(k)}">${esc(k)} ${n}</span>`).join("");
    $("out").innerHTML = `<div class="head">${esc(d.headline)}</div>
      <div class="grid">
        ${card("Decisions opened", list(d.decisions_opened, g => `<li><a href="${esc(g.url)}">${esc(g.title)}</a> <span class="id">${esc(g.job)}</span></li>`, "None."))}
        ${card("Decisions made", list(d.decisions_decided, g => `<li><a href="${esc(g.url)}">${esc(g.title)}</a> <span class="id">${esc(g.job)}</span></li>`, "None."))}
      </div>
      ${card("New to-dos for you", list(d.cards_new, t => `<li>${esc(t)}</li>`, "None."))}
      ${card("Architects' log entries", list(d.log_entries, e => `<li><span class="id">${esc(e.id)}</span> ${esc(e.title)} <span class="id">· ${esc(e.who)}</span></li>`, "None that name this day in their heading."))}
      ${card("Operator", (opCounts ? `<div style="margin-bottom:6px">${opCounts}</div>` : "") + list(op.quoted, q => `<li><span class="k ${esc(q.kind)}">${esc(q.kind)}</span><span class="id">${esc(q.time || "")}</span> ${esc(q.text)}</li>`, opCounts ? "Nothing held, no incidents." : "No operator log entries this day.")
        + `<div style="margin-top:6px"><a href="/oplog.html">Full operator log</a></div>`)}
      ${card("Activity", `<ul><li>${a.handoffs_done || 0} handoffs done</li><li>${a.approval_waits || 0} approval waits</li>
        <li>Busiest: ${(a.busiest || []).map(t => `${esc(t.rig)} (${t.n})`).join(", ") || "none"}</li>${(a.new_jobs || []).length ? `<li>New teams: ${a.new_jobs.map(esc).join(", ")}</li>` : ""}</ul>`)}
      ${card("Lounge", list(d.lounge, p => `<li><span class="id">${esc(p.seat)} · ${esc(String(p.at).slice(11))}</span> ${esc(p.text)}</li>`, "No posts."))}`;
  }
  load();
})();
</script>
</body>
</html>
