<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --surface:#f7f9fb; --raised:#fff; --ink:#152033; --muted:#5d687a; --faint:#8a94a4;
  --line:#d7dde5; --grid:#dfe4ea; --signal:#c98200; --signal-soft:#fbf0d9; --cut:#c2412b; --cut-soft:#fbe5e0;
  --edge:#b9c2cd; --team:#e6ebf0; --idle:#c7cfd8;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0a0f17; --surface:#0f1621; --raised:#141d2a; --ink:#e3e8ef; --muted:#8e9aac; --faint:#5d6a7e;
  --line:#212c3c; --grid:#121a26; --signal:#f0b23c; --signal-soft:#2f2511; --cut:#f0765c; --cut-soft:#311a16;
  --edge:#2c394c; --team:#0e1520; --idle:#344257;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100vh}

/* Toolbar */
.stage{position:relative;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:8px 16px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.bar nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px}
.bar nav a:hover{color:var(--ink)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.chip.work i{background:var(--signal)}
.chip.need{color:var(--cut);border-color:color-mix(in srgb,var(--cut) 45%,transparent);background:var(--cut-soft)}
.chip.need i{background:var(--cut)}
.chip.need.zero{color:var(--muted);border-color:var(--line);background:none}
.chip.need.zero i{background:var(--idle)}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:8px}
.btn:hover{color:var(--ink)}
.btn[aria-pressed="true"]{color:var(--ink);background:var(--raised)}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* Canvas */
svg{flex:1;width:100%;height:100%;display:block;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px}
svg.panning{cursor:grabbing}
.team rect.box{fill:var(--team);stroke:var(--line)}
.team{cursor:move}
.team .tname{font-size:13px;font-weight:700;fill:var(--ink)}
.team .tphase{font-size:12px;font-weight:600;fill:var(--signal)}
.team .tmeta{font-size:12px;fill:var(--faint)}
.team.quiet .tname{fill:var(--muted)}

.edge{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-linecap:round}
.edge.live{stroke:var(--signal);stroke-width:2;stroke-dasharray:5 7;animation:flow 1s linear infinite}
.edge.stuck{stroke:var(--cut);stroke-width:2}
.edge.old{stroke-dasharray:2 5;opacity:.7}
@keyframes flow{to{stroke-dashoffset:-24}}
.count{font-size:10.5px;font-weight:700;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.countbg{fill:var(--paper);stroke:var(--edge)}

.node{cursor:pointer}
.node rect.card{fill:var(--raised);stroke:var(--line);stroke-width:1}
.node .dot{fill:var(--idle)}
.node .nm{font-size:13.5px;font-weight:700;fill:var(--ink)}
.node .rt{font-size:11px;font-weight:600;fill:var(--faint);text-anchor:end}
.node .act{font-size:12.5px;fill:var(--faint)}
.node.idle{opacity:.78}
.node.working rect.card{stroke:color-mix(in srgb,var(--signal) 70%,transparent);stroke-width:1.5}
.node.working .dot{fill:var(--signal)}
.node.working .act{fill:var(--ink)}
.node.blocked rect.card{fill:var(--cut-soft);stroke:var(--cut);stroke-width:1.5}
.node.blocked .dot{fill:var(--cut)}
.node.blocked .act{fill:var(--cut);font-weight:600}
.node.inferred .dot{fill:none;stroke:var(--signal);stroke-width:1.5}
.node.inferred.idle .dot{stroke:var(--idle)}
.node.sel rect.card{stroke:var(--ink);stroke-width:2}
.node .pulse{fill:none;stroke:var(--signal);opacity:0}
.node.working .pulse{animation:ping 2s ease-out infinite}
.node.blocked .pulse{stroke:var(--cut);animation:ping 1.2s ease-out infinite}
@keyframes ping{0%{opacity:.6;r:5}100%{opacity:0;r:13}}
.hist rect{fill:var(--line)}
.hist rect.w{fill:var(--signal)} .hist rect.b{fill:var(--cut)} .hist rect.i{fill:var(--idle)}
@media (prefers-reduced-motion:reduce){.edge.live,.node .pulse{animation:none!important}}

.tip{position:absolute;z-index:5;max-width:360px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 12px 32px color-mix(in srgb,#000 28%,transparent);pointer-events:none;font-size:13px}
.tip b{display:block;font-size:14px}
.tip p{margin:6px 0 4px;word-break:break-word}
.tip .raw{color:var(--faint);font-size:12px;word-break:break-all}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--faint);pointer-events:none}

/* Side panel */
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 24px}
.allclear{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.allclear i{width:8px;height:8px;border-radius:50%;background:#3cb371}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{all:unset;cursor:pointer;display:block;padding:9px 11px;border-radius:10px;background:var(--cut-soft);border:1px solid color-mix(in srgb,var(--cut) 40%,transparent)}
.alert b{display:block;color:var(--cut);font-size:13.5px}
.alert span{font-size:12.5px;color:var(--muted)}
.alert:focus-visible{outline:2px solid var(--cut);outline-offset:2px}
.det{margin-top:20px}
.det h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.det .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.state{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:8px}
.state i{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.state.working i{background:var(--signal)} .state.blocked{color:var(--cut)} .state.blocked i{background:var(--cut)}
.now{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;word-break:break-word}
.now.blocked{border-color:var(--cut);color:var(--cut)}
.sec{margin-top:18px}
.sec h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--muted)}
.strip{display:flex;gap:2px;height:16px;align-items:stretch}
.strip i{flex:1;border-radius:2px;background:var(--line)}
.strip i.w{background:var(--signal)} .strip i.b{background:var(--cut)} .strip i.i{background:var(--idle)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:4px}
.inbox{list-style:none;margin:0;padding:0;font-size:13px}
.inbox li{padding:7px 0;border-top:1px solid var(--line)}
.inbox li span{color:var(--muted)}
.empty{font-size:13px;color:var(--faint)}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--faint)}
details.raw p{font-size:12px;color:var(--muted);word-break:break-all;margin:6px 0 0}
code.cmd{display:block;padding:8px 10px;background:var(--raised);border:1px solid var(--line);border-radius:8px;font-size:12px;word-break:break-all;user-select:all}
aside{min-width:0}
.alertwrap{position:relative}
.dismiss,.undo{all:unset;cursor:pointer;font-size:12px;font-weight:650;color:var(--muted);padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--raised)}
.alertwrap .dismiss{position:absolute;top:8px;right:8px}
.alertwrap .alert{padding-right:84px}
.dismiss:hover,.undo:hover{color:var(--ink)}
.dismiss:focus-visible,.undo:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
details.dismissed{margin-top:8px;font-size:12.5px;color:var(--muted)}
details.dismissed summary{cursor:pointer}
.drow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
#msgBox{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
#msgBox:focus{outline:2px solid var(--signal);outline-offset:0;border-color:transparent}
.msgrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.msgrow .btn,.cmdrow .btn{flex:none;white-space:nowrap}
.msgrow .msg{font-size:12.5px;color:var(--muted)}
.cmdrow{display:flex;gap:6px;align-items:stretch}
.cmdrow code.cmd{flex:1;min-width:0}
.ctxbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ctxbar i{display:block;height:100%;background:var(--muted)}
.ctxbar i.hot{background:var(--signal)}
aside *{overflow-wrap:anywhere}
.alert.warn{background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 45%,transparent)}
.alert.warn b{color:var(--signal)}
.now .el{margin-top:4px;font-size:12px;color:var(--muted)}
pre.screen{margin:8px 0 0;max-height:340px;overflow:auto;background:#05080d;color:#c9d3e0;border:1px solid var(--line);border-radius:8px;padding:10px;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:900px){body{overflow:auto}.wrap{grid-template-columns:1fr;height:auto}.stage{height:70vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<script src="/notify.js"></script>
<script src="/health.js"></script>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stagebox">
    <div class="bar">
      <h1>Live graph</h1>
      <nav><a href="/">Niche board</a> &nbsp; <a href="/runs.html">Run report</a></nav>
      <div class="spacer"></div>
      <span class="chip work" id="cWork"><i></i>0 working</span>
      <span class="chip need zero" id="cNeed"><i></i>0 need you</span>
      <button class="btn" id="bHist" aria-pressed="false" type="button">Show older handoffs</button>
      <button class="btn" id="bFit" type="button">Fit</button>
      <button class="btn" id="bReset" type="button" title="Forget dragged positions">Reset layout</button>
      <div id="healthSlot"></div>
      <div id="alertSlot"></div>
    </div>
    <svg id="g" role="img" aria-label="Agent teams and the work moving between them"></svg>
    <div class="tip" id="tip" hidden></div>
    <div class="hint">Scroll to zoom, drag the background to pan, drag an agent or team to move it</div>
  </div>
  <aside aria-label="Details">
    <div id="alerts"></div>
    <div class="det" id="detail"></div>
  </aside>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PHASE = {longlist:"Gathering the longlist",screen:"Screening",checkpoint:"Waiting for you","deep-dive":"Deep dives",shortlist:"Shortlisting",done:"Finished"};
const W = 230, H = 66, ROW = 140, COL = 256, TEAMGAP = 80;
let data = null, selected = new URLSearchParams(location.search).get("seat"), auto = {}, pos = {}, teamOrder = [];
let cam = null, drag = null, pan = null, showOld = false;

const store = { get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const saved = store.get("rigGraphPositions2", {});
showOld = store.get("rigGraphShowOld", false);

const stateOf = n => n.state.startsWith("needs_input") ? "blocked" : n.state === "working" ? "working" : "idle";
const isLead = n => /(^|-)lead$|^operator-/.test(n.name) && !/^advisor/.test(n.name);
const rt = r => r === "claude-code" ? "Claude" : r === "codex" ? "Codex" : r;
const mm = e => { if (!e) return e; const h = /(\d+)h/.exec(e), m = /(\d+)m/.exec(e); const t = (h ? +h[1]*60 : 0) + (m ? +m[1] : 0); return t < 1 ? "under a minute" : t < 60 ? `${t} min` : `${Math.floor(t/60)} h ${t%60} min`; };
const trunc = (s, n) => (s = String(s || "")).length > n ? s.slice(0, n - 1) + "…" : s;
const ago = s => s == null ? "" : s < 60 ? "just now" : s < 3600 ? `${Math.round(s/60)} min ago` : `${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min ago`;
const stateText = n => { const s = stateOf(n); return s === "blocked" ? "Needs your approval" : s === "working" ? (n.inferred ? "Active (from screen changes)" : "Working") : (n.inferred ? "Idle (from screen changes)" : "Idle"); };

// ---------- Layout: each team is a small tree, lead on top, members in a row.
function layout(){
  const groups = {};
  data.nodes.forEach(n => (groups[n.rig] ||= []).push(n));
  const names = Object.keys(groups).sort((a,b) => (a === "kernel") - (b === "kernel") || groups[b].length - groups[a].length || a.localeCompare(b));
  teamOrder = names; auto = {};
  // Pack teams into rows that fit the visible width at 1:1, so text stays readable.
  const maxRow = Math.max(COL * 3, ($("g").clientWidth || 1200) - 80);
  let x = 0, y = 0, rowH = 0;
  for (const rig of names){
    const ns = groups[rig].slice().sort((a,b) => isLead(b) - isLead(a) || a.name.localeCompare(b.name));
    const lead = isLead(ns[0]) ? ns[0] : null, rest = lead ? ns.slice(1) : ns;
    const cols = Math.max(rest.length, 1), width = cols * COL, height = (lead && rest.length ? ROW : 0) + H + 70;
    if (x > 0 && x + width > maxRow){ x = 0; y += rowH + 40; rowH = 0; }
    if (lead) auto[lead.id] = {x: x + width/2, y};
    rest.forEach((n,i) => auto[n.id] = {x: x + COL/2 + i*COL, y: y + (lead ? ROW : 0)});
    x += width + TEAMGAP; rowH = Math.max(rowH, height);
  }
  pos = {};
  data.nodes.forEach(n => pos[n.id] = saved[n.id] ? {...saved[n.id]} : {...auto[n.id]});
}
function teamBox(rig){
  const ps = data.nodes.filter(n => n.rig === rig).map(n => pos[n.id]);
  const x0 = Math.min(...ps.map(p => p.x)) - W/2 - 20, x1 = Math.max(...ps.map(p => p.x)) + W/2 + 20;
  const y0 = Math.min(...ps.map(p => p.y)) - H/2 - 46, y1 = Math.max(...ps.map(p => p.y)) + H/2 + 20;
  return {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
}
function bounds(){
  const bs = teamOrder.map(teamBox);
  const x0 = Math.min(...bs.map(b => b.x)), y0 = Math.min(...bs.map(b => b.y));
  return {x: x0, y: y0, w: Math.max(...bs.map(b => b.x + b.w)) - x0, h: Math.max(...bs.map(b => b.y + b.h)) - y0};
}

// ---------- Camera: never enlarge past 1:1, so text matches the rest of the page.
function fit(){
  const b = bounds(), el = $("g"), vw = el.clientWidth || 1000, vh = el.clientHeight || 700, pad = 40;
  const maxK = vw >= 1600 ? 1.25 : 1;
  const k = Math.min(maxK, (vw - 2*pad) / b.w, (vh - 2*pad) / b.h);
  cam = {k, x: b.x - (vw/k - b.w)/2, y: b.y - (vh/k - b.h)/2};
  applyCam();
}
function applyCam(){ const el = $("g"); el.setAttribute("viewBox", `${cam.x} ${cam.y} ${el.clientWidth/cam.k} ${el.clientHeight/cam.k}`); }
function toWorld(ev){ const r = $("g").getBoundingClientRect(); return {x: cam.x + (ev.clientX - r.left)/cam.k, y: cam.y + (ev.clientY - r.top)/cam.k}; }

// ---------- Edges attach to the side of a card that faces the other card.
function anchor(p, q){
  const dx = q.x - p.x, dy = q.y - p.y;
  if (Math.abs(dy) > Math.abs(dx) * 0.35) return dy > 0 ? {x: p.x, y: p.y + H/2, nx: 0, ny: 1} : {x: p.x, y: p.y - H/2, nx: 0, ny: -1};
  return dx > 0 ? {x: p.x + W/2, y: p.y, nx: 1, ny: 0} : {x: p.x - W/2, y: p.y, nx: -1, ny: 0};
}
function curve(p, q){
  const a = anchor(p, q), b = anchor(q, p), d = Math.max(40, Math.hypot(b.x - a.x, b.y - a.y) * 0.4);
  return {d: `M${a.x},${a.y} C${a.x + a.nx*d},${a.y + a.ny*d} ${b.x + b.nx*d},${b.y + b.ny*d} ${b.x},${b.y}`,
          mx: (a.x + b.x)/2 + (a.nx + b.nx)*d*0.375, my: (a.y + b.y)/2 + (a.ny + b.ny)*d*0.375};
}

// ---------- Draw
function draw(){
  const info = Object.fromEntries((data.rigs || []).map(r => [r.name, r]));
  let s = `<defs>${["e","live","stuck"].map(k => `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--${k==="e"?"edge":k==="live"?"signal":"cut"})"/></marker>`).join("")}</defs>`;
  for (const rig of teamOrder){
    const b = teamBox(rig), ns = data.nodes.filter(n => n.rig === rig), busy = ns.filter(n => stateOf(n) !== "idle").length, ph = info[rig]?.phase;
    s += `<g class="team ${busy ? "" : "quiet"}" data-rig="${esc(rig)}"><rect class="box" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="16"/>
      <text class="tname" x="${b.x+16}" y="${b.y+26}">${esc(rig)}</text>
      <text class="tmeta" x="${b.x+b.w-16}" y="${b.y+26}" text-anchor="end">${busy ? `${busy} active` : "all idle"}</text>
      ${ph ? `<text class="tphase" x="${b.x+16 + rig.length*7.6 + 12}" y="${b.y+26}">${esc(PHASE[ph] || ph)}</text>` : ""}</g>`;
  }
  for (const e of data.edges || []){
    const pa = pos[e.a], pb = pos[e.b]; if (!pa || !pb) continue;
    const live = e.active > 0, stuck = e.stuck > 0;
    if (!live && !stuck && !e.recent && !showOld) continue;
    const towardA = live && e.active_to === e.a;
    const c = towardA ? curve(pb, pa) : curve(pa, pb);
    const cls = stuck ? "stuck" : live ? "live" : e.recent ? "" : "old";
    const mk = stuck ? "m-stuck" : live ? "m-live" : "m-e";
    const ends = live || stuck ? `marker-end="url(#${mk})"` : `${e.a_to_b ? `marker-end="url(#${mk})"` : ""} ${e.b_to_a ? `marker-start="url(#${mk})"` : ""}`;
    const label = `${e.a.split("@")[0]} → ${e.b.split("@")[0]}: ${e.a_to_b}, back: ${e.b_to_a}${live ? `, ${e.active} open` : ""}`;
    s += `<path class="edge ${cls}" d="${c.d}" ${ends}><title>${esc(label)}</title></path>`;
    if (e.total > 1) s += `<circle class="countbg" cx="${c.mx}" cy="${c.my}" r="9"/><text class="count" x="${c.mx}" y="${c.my}">${e.total}</text>`;
  }
  for (const n of data.nodes){
    const p = pos[n.id], st = stateOf(n), x = p.x - W/2, y = p.y - H/2;
    const act = st === "idle" ? "Idle" : trunc((n.action || "Working") + (n.elapsed && st === "working" ? `, ${mm(n.elapsed)}` : ""), 80);
    const hist = (n.history || []), bw = (W - 28) / 30;
    s += `<g class="node ${st} ${n.inferred ? "inferred" : ""} ${n.id === selected ? "sel" : ""}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}: ${esc(stateText(n))}. ${esc(n.action || "")}">
      <rect class="card" x="${x}" y="${y}" width="${W}" height="${H}" rx="12"/>
      <circle class="pulse" cx="${x+18}" cy="${y+21}" r="5"/><circle class="dot" cx="${x+18}" cy="${y+21}" r="4.5"/>
      <text class="nm" x="${x+31}" y="${y+26}">${esc(n.name)}</text>
      <text class="rt" x="${x+W-14}" y="${y+26}">${esc(rt(n.runtime))}${n.work.length ? `  ${n.work.length} in` : ""}</text>
      <text class="act" x="${x+14}" y="${y+46}">${esc(act)}</text>
      <g class="hist" aria-hidden="true">${Array.from({length:30}, (_,i) => `<rect class="${hist[i] || ""}" x="${x+14+i*bw}" y="${y+H-9}" width="${Math.max(1, bw-1.2)}" height="3" rx="1"/>`).join("")}</g>
    </g>`;
  }
  $("g").innerHTML = s;
  lastSig = "";
  fitText();
}
// Trim card text by its real rendered width, so nothing spills past the card edge.
function fitText(){
  $("g").querySelectorAll(".node").forEach(el => {
    const nm = el.querySelector(".nm"), rtx = el.querySelector(".rt"), act = el.querySelector(".act");
    const room = (t, w) => { if (!t) return; let s = t.textContent; if (t.getComputedTextLength() <= w) return;
      while (s.length > 1 && t.getComputedTextLength() > w){ s = s.slice(0, -1); t.textContent = s.trimEnd() + "…"; } };
    room(nm, W - 31 - 14 - (rtx ? rtx.getComputedTextLength() + 10 : 0));
    room(act, W - 28);
  });
}

// ---------- Side panel
const drafts = {}, sentNote = {}; let renderAlertsOnly = false;
function side(){
  if (document.activeElement && document.activeElement.id === "msgBox"){ renderAlertsOnly = true; }
  const all = data.alerts || [], al = all.filter(a => !a.dismissed), dis = all.filter(a => a.dismissed);
  $("alerts").innerHTML = (al.length
    ? `<div class="alerts">${al.map(a => `<div class="alertwrap"><button class="alert ${a.severity === "warn" ? "warn" : ""}" data-node="${esc(a.node)}"><b>${esc(a.text)}</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ""}</button><button class="dismiss" data-key="${esc(a.key)}" title="It's fine: hide this until it clears">Dismiss</button></div>`).join("")}</div>`
    : `<div class="allclear"><i></i>All clear: nothing is waiting on you</div>`)
    + (dis.length ? `<details class="dismissed"><summary>${dis.length} dismissed</summary>${dis.map(a => `<div class="drow"><span>${esc(a.text)}</span><button class="undo" data-key="${esc(a.key)}">Restore</button></div>`).join("")}</details>` : "");
  $("alerts").querySelectorAll(".alert").forEach(b => b.onclick = () => select(b.dataset.node));
  const send = (key, undo) => fetch("/api/dismiss", {method:"POST", headers:{"Content-Type":"application/json","X-Rig-Console":"1"}, body: JSON.stringify({key, undo})}).then(refresh);
  $("alerts").querySelectorAll(".dismiss").forEach(b => b.onclick = () => send(b.dataset.key, false));
  $("alerts").querySelectorAll(".undo").forEach(b => b.onclick = () => send(b.dataset.key, true));
  if (renderAlertsOnly){ renderAlertsOnly = false; return; }
  const n = data.nodes.find(x => x.id === selected) || data.nodes.find(x => stateOf(x) === "blocked") || data.nodes.find(x => stateOf(x) === "working") || data.nodes[0];
  if (!n){ $("detail").innerHTML = ""; return; }
  const st = stateOf(n);
  $("detail").innerHTML = `<h2>${esc(n.name)}</h2><div class="sub">${esc(n.rig)} team, ${esc(rt(n.runtime))}${n.model ? ` (${esc(n.model)})` : ""}</div>
    <div class="state ${st}"><i></i>${esc(stateText(n))}</div>
    <div class="now ${st === "blocked" ? "blocked" : ""}">${esc(n.action || "Nothing on screen yet")}${n.elapsed && st === "working" ? `<div class="el">Working for ${esc(mm(n.elapsed))}</div>` : ""}</div>
    ${n.ctx ? `<div class="sec"><h3>Context window</h3><div class="ctxbar"><i style="width:${Math.min(100, n.ctx.percent)}%" class="${n.ctx.percent >= 80 ? "hot" : ""}"></i></div><div class="axis"><span>${Math.round(n.ctx.percent)}% used</span><span>${n.ctx.percent >= 80 ? "near the limit" : ""}</span></div></div>` : ""}
    <div class="sec"><h3>Last 30 minutes</h3><div class="strip">${Array.from({length:30}, (_,i) => `<i class="${(n.history||[])[i] || ""}"></i>`).join("")}</div>
      <div class="axis"><span>30 min ago</span><span>now</span></div></div>
    <div class="sec"><h3>Inbox</h3>${n.work.length ? `<ul class="inbox">${n.work.map(w => `<li><b>${esc(w.state)}</b> from ${esc((w.from||"").split("@")[0])} <span>${ago(w.age_s)}</span></li>`).join("")}</ul>` : `<div class="empty">No open work.</div>`}</div>
    <div class="sec"><h3>Screen</h3><div class="empty">${n.unchanged_s == null ? "No screen captured yet" : n.since_start ? `Unchanged since the dashboard started watching (${ago(n.watched_s).replace(" ago","")})` : `Last changed ${ago(n.unchanged_s)}`}</div>
      <details class="raw" id="screenBox" ${screenOpen ? "open" : ""}><summary>Show its screen</summary><pre class="screen" id="screenPre">${esc(screenCache[n.id] || "Loading…")}</pre></details></div>
    <div class="sec"><h3>Message it</h3>
      ${st === "blocked" ? `<div class="empty">Sending is off while it waits at an approval prompt: typed text could answer the prompt. Answer it in its terminal first.</div>`
        : `<textarea id="msgBox" rows="3" placeholder="Write to ${esc(n.name)}. It arrives in its conversation, labeled as from you.">${esc(drafts[n.id] || "")}</textarea>
           <div class="msgrow"><button class="btn" id="msgSend" type="button">Send</button><span class="msg" id="msgNote">${esc(sentNote[n.id] || "")}</span></div>`}</div>
    <div class="sec"><h3>Talk to it in Ubuntu</h3><div class="cmdrow"><code class="cmd">tmux attach -t '${esc(n.id)}'</code><button class="btn copy" id="copyCmd" type="button">Copy</button></div></div>`;
  wireScreen(n.id);
  const box = $("msgBox"), sendBtn = $("msgSend");
  if (box){ box.oninput = e => drafts[n.id] = e.target.value; box.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendBtn.click(); }; }
  if (sendBtn) sendBtn.onclick = async () => {
    const text = (drafts[n.id] || "").trim(); if (!text) return;
    sendBtn.disabled = true; $("msgNote").textContent = "Sending…";
    try {
      const r = await (await fetch("/api/send", {method:"POST", headers:{"Content-Type":"application/json","X-Rig-Console":"1"}, body: JSON.stringify({seat: n.id, message: text})})).json();
      if (r.error){ sentNote[n.id] = r.error; } else { sentNote[n.id] = "Sent " + new Date(r.at).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); drafts[n.id] = ""; }
    } catch { sentNote[n.id] = "Couldn't reach the dashboard server"; }
    side();
  };
  const cp = $("copyCmd");
  if (cp) cp.onclick = async () => {
    const text = `tmux attach -t '${n.id}'`;
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    cp.textContent = "Copied"; setTimeout(() => { if (cp.isConnected) cp.textContent = "Copy"; }, 1500);
  };
}
let screenOpen = false; const screenCache = {};
async function loadScreen(id){
  const pre = $("screenPre"); if (!pre || !screenOpen) return;
  try {
    const r = await (await fetch(`/api/screen?seat=${encodeURIComponent(id)}`, {cache:"no-store"})).json();
    const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 30;
    pre.textContent = screenCache[id] = r.error ? r.error : r.lines.join("\n");
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch { pre.textContent = "Couldn't load the screen."; }
}
function wireScreen(id){
  const box = $("screenBox"); if (!box) return;
  box.ontoggle = () => { screenOpen = box.open; if (screenOpen) loadScreen(id); };
  if (screenOpen){ const pre = $("screenPre"); pre.scrollTop = pre.scrollHeight; loadScreen(id); }
}
function chips(){
  const w = data.nodes.filter(n => stateOf(n) === "working").length, need = (data.alerts || []).filter(a => !a.dismissed).length;
  $("cWork").innerHTML = `<i></i>${w} working`;
  $("cNeed").innerHTML = `<i></i>${need} need${need === 1 ? "s" : ""} you`;
  $("cNeed").classList.toggle("zero", need === 0);
}
function select(id){ selected = id; history.replaceState(null, "", `?seat=${encodeURIComponent(id)}`); draw(); side(); }

// ---------- Hover card
function tip(ev, id){
  const n = data.nodes.find(x => x.id === id), t = $("tip");
  if (!n || drag || pan){ t.hidden = true; return; }
  t.innerHTML = `<b>${esc(n.name)}</b><span style="color:var(--muted);font-size:12.5px">${esc(stateText(n))}</span><p>${esc(n.action || "Nothing on screen yet")}</p>${n.raw && n.raw !== n.action ? `<div class="raw">${esc(trunc(n.raw, 220))}</div>` : ""}`;
  t.hidden = false;
  const r = $("stagebox").getBoundingClientRect();
  t.style.left = Math.min(ev.clientX - r.left + 14, r.width - t.offsetWidth - 10) + "px";
  t.style.top = Math.min(ev.clientY - r.top + 14, r.height - t.offsetHeight - 10) + "px";
}

// ---------- Interaction: drag agents, drag teams, pan, zoom
function wire(){
  const g = $("g");
  g.addEventListener("pointerdown", ev => {
    const nodeEl = ev.target.closest(".node"), teamEl = ev.target.closest(".team"), w = toWorld(ev);
    $("tip").hidden = true;
    if (nodeEl || teamEl){
      const ids = nodeEl ? [nodeEl.dataset.id] : data.nodes.filter(n => n.rig === teamEl.dataset.rig).map(n => n.id);
      drag = {ids, w, orig: Object.fromEntries(ids.map(id => [id, {...pos[id]}])), moved: false, node: nodeEl?.dataset.id};
    } else { pan = {sx: ev.clientX, sy: ev.clientY, cx: cam.x, cy: cam.y}; g.classList.add("panning"); }
    g.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  g.addEventListener("pointermove", ev => {
    if (pan){ cam.x = pan.cx - (ev.clientX - pan.sx)/cam.k; cam.y = pan.cy - (ev.clientY - pan.sy)/cam.k; applyCam(); return; }
    if (drag){
      const w = toWorld(ev), dx = w.x - drag.w.x, dy = w.y - drag.w.y;
      if (!drag.moved && Math.hypot(dx, dy) * cam.k < 4) return;
      drag.moved = true;
      drag.ids.forEach(id => pos[id] = {x: drag.orig[id].x + dx, y: drag.orig[id].y + dy});
      draw(); return;
    }
    const el = ev.target.closest(".node"); el ? tip(ev, el.dataset.id) : ($("tip").hidden = true);
  });
  const end = () => {
    g.classList.remove("panning"); pan = null;
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved){ d.ids.forEach(id => saved[id] = pos[id]); store.set("rigGraphPositions2", saved); }
    else if (d.node) select(d.node);
  };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
  g.addEventListener("pointerleave", () => { if (!drag && !pan) $("tip").hidden = true; });
  g.addEventListener("wheel", ev => {
    ev.preventDefault();
    const w = toWorld(ev), k = Math.min(2, Math.max(0.25, cam.k * Math.exp(-ev.deltaY * 0.0015)));
    const r = g.getBoundingClientRect();
    cam = {k, x: w.x - (ev.clientX - r.left)/k, y: w.y - (ev.clientY - r.top)/k}; applyCam();
  }, {passive: false});
  g.addEventListener("keydown", ev => { const el = ev.target.closest(".node"); if (el && (ev.key === "Enter" || ev.key === " ")){ ev.preventDefault(); select(el.dataset.id); } });
  $("bFit").onclick = fit;
  $("bReset").onclick = () => { Object.keys(saved).forEach(k => delete saved[k]); store.set("rigGraphPositions2", saved); layout(); draw(); fit(); };
  $("bHist").onclick = () => { showOld = !showOld; store.set("rigGraphShowOld", showOld); $("bHist").setAttribute("aria-pressed", showOld); draw(); };
  $("bHist").setAttribute("aria-pressed", showOld);
  window.addEventListener("resize", () => cam && applyCam());
}

let lastKey = "", lastSig = "";
async function refresh(){
  if (drag || pan) return;
  try { data = await (await fetch("/api/graph", {cache: "no-store"})).json(); } catch { return; }
  if (!data.nodes) return;
  const key = data.nodes.map(n => n.id).sort().join("|");
  // Fit only on first load or when you press Fit, never while you're looking around.
  if (key !== lastKey){ const first = !lastKey; lastKey = key; layout(); draw(); if (first) fit(); }
  else {
    data.nodes.forEach(n => { if (!pos[n.id]) pos[n.id] = saved[n.id] || {x: 0, y: 0}; });
    const sig = JSON.stringify([data.nodes.map(n => [n.id, n.state, n.action, mm(n.elapsed), (n.history||[]).join(""), n.work.length, n.inferred]),
      (data.edges||[]).map(e => [e.a, e.b, e.total, e.active, e.active_to, e.stuck, e.recent]), (data.rigs||[]).map(r => [r.name, r.phase]), selected, showOld]);
    if (sig !== lastSig){ draw(); lastSig = sig; }
  }
  side(); chips();
}
wire(); refresh(); setInterval(refresh, 5000);
</script>
