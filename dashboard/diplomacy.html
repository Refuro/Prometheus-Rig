<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f17" media="(prefers-color-scheme: dark)">
<title>Diplomacy · Rig Console</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/notify.js"></script>
<script src="/health.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Diplomacy board (lab job, drafted by the Owner's Advisor 2026-10-13; adopted by Platform, R-024/PL-039: no
     ?base=, phase names checked before they reach a URL, only real power names in style attributes. Live sealed
     intentions and the side-by-side tab: R-028/PL-043. The Advisor's pending orders, pair threads, coloured feed
     and no-flicker refresh merged in PL-044.)
     Reads the clerk's files through the existing read-only /job/<job>/... route. The board is the engine's own
     rendered SVG, shown as an <img> so agent-written SVG can never run script here. All agent text is escaped.
     The only write is POST /api/lab/control {job, paused|stop} (owner cookie + X-Rig-Console). -->
<style>
:root{
  --paper:#eef1f4; --surface:#f7f9fb; --raised:#fff; --ink:#152033; --muted:#5d687a; --faint:#8a94a4;
  --line:#d7dde5; --signal:#c98200; --signal-soft:#fbf0d9; --cut:#c2412b; --ok:#2e9d62; --ok-soft:#e3f4ea;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  /* the engine's own palette (standard.svg POWERCOLOR), so the cards match the board */
  --AUSTRIA:#c48f85; --ENGLAND:#9400d3; --FRANCE:#4169e1; --GERMANY:#a08a75; --ITALY:#228b22; --RUSSIA:#757d91; --TURKEY:#b9a61c;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0a0f17; --surface:#0f1621; --raised:#141d2a; --ink:#e3e8ef; --muted:#8e9aac; --faint:#5d6a7e;
  --line:#212c3c; --signal:#f0b23c; --signal-soft:#2f2511; --cut:#f0765c; --ok:#3cb371; --ok-soft:#12261b;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
h2{margin:18px 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.bar .phase{font-size:18px;font-weight:800;letter-spacing:-.01em}
.bar .clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--signal)}
.bar .clock.over{color:var(--cut)}
.bar .state{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--signal-soft);color:var(--signal)}
.bar .state.paused{background:var(--cut);color:#fff}
.bar .state.over{background:var(--ok-soft);color:var(--ok)}
.bar .grow{flex:1}
select{font:inherit;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button{all:unset;cursor:pointer;font-weight:700;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
button.primary{background:var(--signal);border-color:var(--signal);color:#111}
button.danger{border-color:var(--cut);color:var(--cut)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:14px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.board{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;align-self:start}
.board img{max-width:100%;height:auto;border-radius:8px;display:block}
.mapwrap{position:relative;max-width:100%}
.mapwrap .ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}   /* order arrows, same coordinates as the map */
.legend{font-size:12.5px;color:var(--muted);margin-top:6px;align-self:flex-start}
.legend:empty{display:none}
.power .aim{flex-basis:100%;margin:4px 0 0 22px;font-size:12.5px;color:var(--muted);line-height:1.4}
.power .aim b{color:var(--ink);font-weight:700}
.board .empty{padding:30px}
.powers{display:flex;flex-direction:column;gap:8px}
.power{display:flex;gap:10px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left}
.power:hover{border-color:var(--signal)}
.power.sel{outline:2px solid var(--signal)}
.power .dot{width:12px;height:12px;border-radius:50%;flex:none}
.power .name{font-weight:750;flex:1}
.power .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.power .num b{color:var(--ink);font-size:15px}
.power.out{opacity:.5}
.power{flex-wrap:wrap}
.power .orders{flex-basis:100%;margin:4px 0 0 22px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);white-space:pre-wrap}
.power .orders.none{font-style:italic}
.power .orders .live{font:700 10.5px var(--font);color:var(--signal);text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.postgame{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ok-soft);border:1px solid var(--ok)}
.postgame b{color:var(--ok)}
.postgame .pgl{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.postgame .pgl button{padding:6px 12px;font-size:13.5px}
.mdr{overflow-wrap:anywhere;line-height:1.6}
.mdr h2,.mdr h3,.mdr h4{text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px;margin:16px 0 6px}
.mdr .tbl{overflow-x:auto}
.mdr table{border-collapse:collapse;font-size:13.5px}
.mdr th,.mdr td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.mdr code{font:12.5px ui-monospace,monospace;background:var(--surface);padding:1px 4px;border-radius:4px}
.mdr .fref{font:12.5px ui-monospace,monospace;color:var(--muted)}
.tabs button{padding:6px 12px;font-size:13.5px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;font-size:13px;color:var(--muted)}
.msg{border-top:1px solid var(--line);padding:9px 0}
.msg:first-child{border-top:0}
.msg .who{font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .who .ph{color:var(--faint);font-weight:600;margin-left:auto}
.msg .text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.msg .to{color:var(--muted);font-weight:600}
.msg .arrow{color:var(--faint);margin:0 2px}
.msg .text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.msg .more{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--signal);margin-top:2px}
.thread{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px;background:var(--surface)}
.thread>summary{cursor:pointer;font-weight:750;padding:4px 0;list-style:none;display:flex;gap:8px;align-items:center}
.thread>summary::-webkit-details-marker{display:none}
.thread>summary .n{color:var(--muted);font-weight:600;font-size:12.5px;margin-left:auto}
.digest{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.msg .live{font-size:11px;color:var(--signal);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:3px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.md{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.chart{width:100%;height:220px;display:block}
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--paper);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s,visibility .2s;visibility:hidden;overflow:auto;padding:18px 18px 40px;z-index:60}   /* above the top bar (z 30/50), so Close is clickable */
.drawer.open{transform:none;visibility:visible;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmprow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:8px}
.cmprow:first-child{border-top:0;padding-top:0}
.cmpname{display:flex;flex-direction:column;gap:2px}
.cmprow .md{max-height:9.5em;overflow:auto}
@media (max-width:700px){.cmprow{grid-template-columns:1fr}}
.drawer h2{margin-top:16px}
.drawer .head{display:flex;gap:10px;align-items:center}
.drawer .head h1{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chips button{padding:5px 11px;font-size:12.5px;border-radius:999px}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.chips button .cnt{color:var(--muted);font-weight:600;margin-left:5px}
.chips button.on .cnt{color:inherit;opacity:.75}
.convo{display:flex;flex-direction:column;gap:8px}
.convo .day{align-self:center;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:8px 0 2px}
.bub{max-width:88%;padding:8px 11px;border-radius:14px;background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--who)}
.bub.me{align-self:flex-end;border-left:1px solid var(--line);border-right:4px solid var(--who);background:var(--surface)}
.bub .hd{font-size:12px;font-weight:700;color:var(--who);display:flex;gap:8px}
.bub .hd .t{color:var(--faint);font-weight:600;margin-left:auto}
.bub .hd .bc{color:var(--muted);font-weight:600}
.bub .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.seal{font-size:12.5px;color:var(--faint)}
.incident{border-left:4px solid var(--cut)}
.note{font-size:12.5px;color:var(--faint);margin-top:8px}
</style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/md.js"></script>
<main>
  <h1>Diplomacy</h1>
  <div class="sub" id="sub">Seven agent powers, one clerk, one board. You watch; you can pause.</div>

  <div class="bar" id="bar">
    <span class="phase" id="phaseName">—</span>
    <span class="state" id="state">loading</span>
    <span class="clock" id="clock"></span>
    <span class="grow"></span>
    <label id="gameBox" style="font-size:13px;color:var(--muted)" hidden>Game <select id="gameSel"></select></label>
    <label style="font-size:13px;color:var(--muted)">Phase <select id="phaseSel"></select></label>
    <button id="btnLive" hidden title="Follow the phase being played">Back to live</button>
    <label style="font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center" title="Each power's sealed intention, written before press. Turn off to avoid spoilers.">
      <input type="checkbox" id="intToggle"> Show intentions</label>
    <button id="btnPause" class="primary" title="The clerk stops the clock and tells every power">Pause</button>
    <button id="btnResume" hidden>Resume</button>
    <button id="btnStop" class="danger" title="Ends the game after this phase">Stop</button>
  </div>

  <!-- After the game (owner, 2026-10-14): where the writeups are. Shown once board/final.md exists. -->
  <div class="postgame" id="postgame" hidden>
    <b>Game over.</b> <span>Why it ended and who won are in the final standings; the story and the analysis are here too.</span>
    <span class="pgl"><button data-go="final">Final standings</button><button data-go="chronicle">Chronicle</button><button data-go="analysis">Model Architect's analysis</button></span>
  </div>

  <div class="layout">
    <div class="board" id="board"><div class="empty">No board yet. The clerk writes <code>board/&lt;phase&gt;.svg</code> after its dry run.</div></div>
    <div class="powers" id="powers"></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="digest" class="on">Digest</button>
    <button data-tab="press">Press</button>
    <button data-tab="compare">This phase, side by side</button>
    <button data-tab="results">Results</button>
    <button data-tab="chart">Centres over time</button>
    <button data-tab="incidents">Incidents</button>
    <button data-tab="final" class="post" hidden>Final standings</button>
    <button data-tab="chronicle" class="post" hidden>Chronicle</button>
    <button data-tab="analysis" class="post" hidden>Model Architect's analysis</button>
  </div>
  <div class="panel" id="panel"></div>
  <div class="note" id="note"></div>
</main>

<div class="drawer" id="drawer" aria-hidden="true"></div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const JOB = (q.get("job") || "diplomacy-1").replace(/[^A-Za-z0-9._-]/g, "");
  // Every game stays one click away (owner, 2026-10-14). With no ?job=, open the game being played, or the
  // newest finished one, rather than always game 1.
  fetch("/api/lab/games", {cache: "no-store"}).then(r => r.json()).then(({games = []}) => {
    if (!q.get("job") && games.length) {
      const pick = (games.find(g => !g.over) || games[games.length - 1]).job;
      if (pick !== JOB) { location.replace(`?job=${encodeURIComponent(pick)}`); return; }
    }
    if (games.length < 2) return;
    const sel = document.getElementById("gameSel");
    sel.innerHTML = games.map(g => `<option value="${g.job.replace(/[^A-Za-z0-9._-]/g, "")}">${String(g.title).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}${g.over ? " (over)" : ""}</option>`).join("");
    sel.value = JOB;
    sel.onchange = () => { location.href = `?job=${encodeURIComponent(sel.value)}`; };
    document.getElementById("gameBox").hidden = false;
  }).catch(() => {});
  // Always the job's own sandboxed folder. (The draft's ?base= let a crafted link point the page anywhere; PL-039.)
  const BASE = `/job/${JOB}`;
  const POWERS = ["AUSTRIA","ENGLAND","FRANCE","GERMANY","ITALY","RUSSIA","TURKEY"];
  // Phase names come from the clerk (an agent) and go into URLs: only real phase names are used (PL-039).
  const PHASE_RE = /^[SFW]\d{4}[MRA]$/;
  const power = s => { const p = String(s || "").toUpperCase(); return POWERS.includes(p) ? p : null; };
  // Only a real power's name reaches a style attribute (PL-039): agent text there could load outside URLs.
  const colour = s => `var(--${power(s) || "muted"})`;
  const nice = p => p.charAt(0) + p.slice(1).toLowerCase();
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const $ = id => document.getElementById(id);

  const S = { control:null, index:null, phase:null, board:null, timeline:[], press:[], livePress:[], results:"", digest:"", incidents:"", pending:{}, final:false, sel:null, tab:"digest", orders:{}, intentions:{} };
  // Sealed intentions are shown live during the game (owner, 2026-10-13, R-028), behind a per-browser toggle.
  const INT_KEY = "dip.showIntentions";
  S.post = {};   // postgame writeups, loaded on first open
  S.showInt = (() => { try { return localStorage.getItem(INT_KEY) !== "off"; } catch { return true; } })();
  // The Press tab's order (owner, 2026-10-13): oldest first by default, remembered per browser.
  const ORDER_KEY = "dip.pressOrder";
  S.pressOrder = (() => { try { return localStorage.getItem(ORDER_KEY) === "newest" ? "newest" : "oldest"; } catch { return "oldest"; } })();
  // Where a power's intention and orders for a phase live: their own folder while the game runs; intentions move
  // to archive/intentions/ at game end, orders to archive/<phase>/ at each adjudication. p is a checked phase,
  // low one of the seven powers, so no agent text reaches these paths.
  const intentionPath = (low, p) => S.final ? `archive/intentions/${low}/${p}.md` : `powers/${low}/intentions/${p}.md`;
  async function ordersFor(low, p) {
    return (await text(`archive/${p}/orders/${low}.txt`)) ?? (await text(`powers/${low}/orders/${p}.txt`));
  }
  // Game order of checked phase names: year, then Spring < Fall < Winter, then movement < retreats < builds.
  const phaseKey = p => { const m = PHASE_RE.exec(p) && /^([SFW])(\d{4})([MRA])$/.exec(p); return m ? +m[2] * 100 + {S:0,F:10,W:20}[m[1]] + {M:0,R:1,A:2}[m[3]] : -1; };
  S.follow = true;   // follow the live phase; off only while the owner deliberately looks at an earlier one
  const clerkHolds = c => /^paused/.test(String(c.state || ""));   // paused-operator, paused-usage: the clerk's clock is stopped
  const sealLabel = () => S.final ? "Sealed intention, written before press" : "Sealed intention, written before press · live, unarchived until game end";

  // Opening a power's drawer fetched every phase's press, orders and intention: 97 requests per open on a
  // 30-phase game (review-18), the owner's "sometimes takes a while to load". A short cache cuts a re-open to the
  // few live files (7 in review-18's fixture). It holds only an earlier phase's archived press and orders, which
  // the clerk writes once at adjudication. Archiving can be re-run, and intentions are copied into archive/ only
  // after final.md, so nothing is trusted as permanent:
  // - entries expire after 60 s;
  // - a path must count as settled both before and after its fetch, so a phase that becomes "earlier" mid-request
  //   isn't kept (review-18);
  // - archive/intentions/, missing files and everything outside archive/ are always fetched fresh.
  const ARCH = new Map(), ARCH_TTL = 60_000;
  const settled = path => {
    const [top, ph] = path.split("/");
    if (top !== "archive" || !PHASE_RE.test(ph || "")) return false;
    if (S.final) return true;
    const live = S.control?.phase;
    return PHASE_RE.test(live || "") && phaseKey(ph) < phaseKey(live);
  };
  async function text(path) {
    const hit = ARCH.get(path);
    if (hit && Date.now() - hit.at < ARCH_TTL) return hit.t;
    const before = settled(path);
    try {
      const r = await fetch(`${BASE}/${path}`, {cache:"no-store"});
      const t = r.ok ? await r.text() : null;
      if (t != null && before && settled(path)) ARCH.set(path, {t, at: Date.now()});
      return t;
    } catch { return null; }
  }
  async function json(path) { const t = await text(path); if (t == null) return null; try { return JSON.parse(t); } catch { return null; } }
  async function jsonl(path) { const t = await text(path); if (!t) return []; return t.split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean); }

  function phaseLabel(p) {
    // S1901M -> Spring 1901 Movement
    const m = /^([SFW])(\d{4})([MRA])$/.exec(p || "");
    if (!m) return p || "—";
    const s = {S:"Spring",F:"Fall",W:"Winter"}[m[1]], k = {M:"movement",R:"retreats",A:"builds"}[m[3]];
    return `${s} ${m[2]} ${k}`;
  }

  async function loadStatic() {
    S.control = await json("board/control.json");
    S.index = await json("board/index.json");
    S.timeline = await jsonl("board/timeline.jsonl");
    S.incidents = (await text("board/incidents.md")) || "";
    S.final = (await text("board/final.md")) != null;
    const phases = (S.index?.phases || [...new Set(S.timeline.map(r => r.phase))]).filter(p => PHASE_RE.test(p));
    if (S.control && !PHASE_RE.test(S.control.phase || "")) S.control.phase = null;
    if (S.index && !PHASE_RE.test(S.index.current || "")) S.index.current = null;
    if (S.index) S.index.phases = phases;   // every later use of the phase list sees checked names only
    if (S.control?.phase && !phases.includes(S.control.phase)) phases.push(S.control.phase);
    // The live phase is the latest the clerk has named anywhere (index or control file), so one stale or
    // half-written file can't hold the page back. Following is on unless the owner picked an earlier phase.
    S.live = [S.index?.current, S.control?.phase, phases[phases.length - 1]].filter(Boolean)
      .reduce((a, b) => (a && phaseKey(a) >= phaseKey(b) ? a : b), null);
    if (S.follow || !S.phase) S.phase = S.live;
    const sel = $("phaseSel"); const cur = sel.value;
    sel.innerHTML = phases.map(p => `<option value="${esc(p)}">${esc(phaseLabel(p))}</option>`).join("");
    sel.value = S.phase || cur;
  }

  // The board file is agent-written. Its units and centres become lists of short plain strings for the seven
  // powers only. A count is then a real list's length, never a value the clerk wrote (review-1 by
  // dev-codex@platform-dev, 2026-10-14: {"length": "<img onerror>"} reached innerHTML as a "count").
  function cleanBoard(b) {
    if (!b || typeof b !== "object" || Array.isArray(b)) return null;
    const list = v => Array.isArray(v) ? v.filter(x => typeof x === "string").map(x => x.slice(0, 40)).slice(0, 40) : [];
    const per = o => Object.fromEntries(POWERS.map(p => [p, list(o && typeof o === "object" ? o[p] : null)]));
    return { units: per(b.units), centers: per(b.centers) };
  }

  async function loadPhase() {
    if (!S.phase || !PHASE_RE.test(S.phase)) return;
    const p = S.phase;
    [S.board, S.press, S.livePress] = await Promise.all([
      json(`board/${p}.json`),
      jsonl(`archive/${p}/press.jsonl`),
      // during an open phase the archive is empty; powers also append each message to their own sent.jsonl
      Promise.all(POWERS.map(w => jsonl(`powers/${w.toLowerCase()}/press/sent.jsonl`))).then(a => a.flat().filter(m => m.phase === p)),
    ]);
    S.board = cleanBoard(S.board);
    S.results = (await text(`board/${p}-results.md`)) || "";
    // Orders as they stand right now: each power's own orders/<phase>.txt (overwritten until the deadline),
    // or the archived copy once the phase is adjudicated. Owner-only view; powers never see the console.
    S.pending = Object.fromEntries(await Promise.all(POWERS.map(async w => {
      const low = w.toLowerCase();
      const t = (await text(`archive/${p}/orders/${low}.txt`)) ?? (await text(`powers/${low}/orders/${p}.txt`));
      return [w, t == null ? null : t.trim()];
    })));
    // This phase's sealed intentions, only while Show intentions is on (seven small reads, like the orders).
    S.intent = S.showInt ? Object.fromEntries(await Promise.all(POWERS.map(async w => [w, await text(intentionPath(w.toLowerCase(), p))]))) : {};
    S.digest = (await text(`board/${p}-digest.md`)) || "";
    // The clerk writes a phase's digest and results when it adjudicates, so the phase being played has none
    // yet. Then show the latest finished phase's, labelled with its phase (owner, 00:21Z: following the live
    // phase hid every digest). Checked phase names only; at most three earlier phases are tried.
    S.prev = null;
    if (!S.digest || !S.results) {
      const earlier = (S.index?.phases || []).filter(ph => phaseKey(ph) >= 0 && phaseKey(ph) < phaseKey(p)).sort((a, b) => phaseKey(b) - phaseKey(a)).slice(0, 3);
      for (const ph of earlier) {
        const [dg, rs] = await Promise.all([text(`board/${ph}-digest.md`), text(`board/${ph}-results.md`)]);
        if (dg || rs) { S.prev = { phase: ph, digest: dg || "", results: rs || "" }; break; }
      }
    }
    const img = $("board");
    const r = await fetch(`${BASE}/board/${p}.svg`, {method:"HEAD", cache:"no-store"}).catch(() => null);
    const stamp = r && r.ok ? `${p}|${r.headers.get("last-modified") || ""}|${r.headers.get("etag") || ""}|${r.headers.get("content-length") || ""}` : `${p}|none`;
    if (stamp !== S.boardStamp) {   // only touch the <img> when the file really changed, so the map doesn't blink
      S.boardStamp = stamp;
      const src = `${BASE}/board/${p}.svg?v=${encodeURIComponent(stamp)}`;
      img.innerHTML = r && r.ok ? `<div class="mapwrap"><img alt="Board after ${esc(phaseLabel(p))}" src="${esc(src)}"><svg class="ovl" id="ovl" aria-hidden="true"></svg></div><div class="legend" id="legend"></div>`
                                : `<div class="empty">No board image for ${esc(phaseLabel(p))} yet.</div>`;
      S.geo = r && r.ok ? parseGeo(await text(`board/${p}.svg`)) : null;
    }
  }

  // Where each province sits on the clerk's map, for the order arrows. The SVG is agent-written, so it is only
  // parsed as data (DOMParser runs no script) and only numbers come out of it: the viewBox, and the x/y of each
  // three-letter province label. Nothing from it is ever inserted into the page.
  function parseGeo(t) {
    if (!t) return null;
    try {
      const d = new DOMParser().parseFromString(t, "image/svg+xml"), svg = d.documentElement;
      if (!svg || svg.nodeName !== "svg") return null;
      const vb = String(svg.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
      if (vb.length !== 4 || !vb.every(Number.isFinite) || vb[2] <= 0 || vb[3] <= 0) return null;
      const pts = {};
      for (const el of d.getElementsByTagName("text")) {
        const k = String(el.textContent || "").trim().toUpperCase();
        if (!/^[A-Z]{3}$/.test(k) || pts[k]) continue;
        let x = parseFloat(el.getAttribute("x") || "0"), y = parseFloat(el.getAttribute("y") || "0"), ok = true;
        // Some labels are placed by transform="translate(x y) rotate(..)" (Portugal is). Add up translates on the
        // label and its groups; anything else on a group (scale, matrix...) and the position is unknown: skip it.
        for (let n = el; n && n !== svg && ok; n = n.parentNode) {
          for (const [, fn, args] of String(n.getAttribute?.("transform") || "").matchAll(/(\w+)\s*\(([^)]*)\)/g)) {
            const v = args.trim().split(/[\s,]+/).map(Number);
            if (fn === "translate" && v.every(Number.isFinite)) { x += v[0]; y += v[1] || 0; }
            else if (!(fn === "rotate" && n === el)) ok = false;
          }
        }
        if (ok && Number.isFinite(x) && Number.isFinite(y)) pts[k] = [x, y - 6];
      }
      return Object.keys(pts).length >= 20 ? { vb, pts } : null;
    } catch { return null; }
  }

  // Each power's orders for the phase on view, drawn as arrows over the map: moves solid, supports dashed,
  // convoys dotted, holds a ring. Built with DOM calls from checked province codes and coordinates only.
  // These are the orders as written (they can still change, and can differ from the sealed intention).
  const NS = "http://www.w3.org/2000/svg";
  const PROV = "([A-Z]{3})(?:/[A-Z]{2})?";
  function parseOrder(line) {
    const m = new RegExp(`^[AF]\\s+${PROV}\\s+(.*)$`, "i").exec(line.trim());
    if (!m) return null;
    const src = m[1].toUpperCase(), rest = m[2].trim(); let x;
    if ((x = new RegExp(`^-\\s*${PROV}`, "i").exec(rest))) return { kind: "move", src, dst: x[1].toUpperCase() };
    if ((x = new RegExp(`^S\\s+[AF]\\s+${PROV}(?:\\s*-\\s*${PROV})?`, "i").exec(rest))) return { kind: "support", src, dst: (x[2] || x[1]).toUpperCase() };
    if ((x = new RegExp(`^C\\s+A\\s+${PROV}\\s*-\\s*${PROV}`, "i").exec(rest))) return { kind: "convoy", src, dst: x[2].toUpperCase() };
    if (/^H\b/i.test(rest)) return { kind: "hold", src };
    if (/^B\b/i.test(rest)) return { kind: "build", src };
    if (/^D\b/i.test(rest)) return { kind: "disband", src };
    return null;
  }
  function renderMap() {
    const ovl = $("ovl"), legend = $("legend");
    if (!ovl || !legend) return;
    ovl.replaceChildren();
    const on = S.showInt && S.geo;
    const live = S.control && S.phase === S.control.phase && !S.results;
    legend.textContent = !S.showInt ? "" : !S.geo ? "Order arrows: this map's province positions couldn't be read."
      : live ? "Arrows: each power's current orders as written. They can still change, and can differ from its sealed intention."
             : "Arrows: the orders each power submitted for this phase.";
    if (S.showInt && S.geo) legend.textContent += " Solid: move · dashed: support · dotted: convoy · ring: hold · dashed ring: build · cross: disband.";
    if (!on) return;
    const [vx, vy, vw, vh] = S.geo.vb, P = S.geo.pts;
    ovl.setAttribute("viewBox", `${vx} ${vy} ${vw} ${vh}`);
    ovl.setAttribute("preserveAspectRatio", "xMinYMin meet");
    const el = (tag, attrs, style) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v)); Object.assign(e.style, style || {}); return e; };
    const defs = el("defs", {});
    for (const p of POWERS) {
      const mk = el("marker", { id: `ah-${p}`, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 4, markerHeight: 4, orient: "auto-start-reverse" });
      mk.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z" }, { fill: `var(--${p})` }));
      defs.appendChild(mk);
    }
    ovl.appendChild(defs);
    for (const p of POWERS) {
      for (const line of String(S.pending[p] || "").split("\n")) {
        const o = parseOrder(line);
        if (!o || !P[o.src]) continue;
        const [x1, y1] = P[o.src];
        if (o.kind === "hold" || o.kind === "build") {
          const dash = o.kind === "build" ? "8 6" : "", r = o.kind === "build" ? 22 : 16;
          ovl.appendChild(el("circle", { cx: x1, cy: y1, r, fill: "none", "stroke-width": 9, "stroke-dasharray": dash }, { stroke: "#fff" }));
          ovl.appendChild(el("circle", { cx: x1, cy: y1, r, fill: "none", "stroke-width": 5, "stroke-dasharray": dash }, { stroke: `var(--${p})` }));
          continue;
        }
        if (o.kind === "disband") {
          for (const [a, b] of [[-1, -1], [-1, 1]]) {
            ovl.appendChild(el("line", { x1: x1 + 16 * a, y1: y1 + 16 * b, x2: x1 - 16 * a, y2: y1 - 16 * b, "stroke-width": 9 }, { stroke: "#fff" }));
            ovl.appendChild(el("line", { x1: x1 + 16 * a, y1: y1 + 16 * b, x2: x1 - 16 * a, y2: y1 - 16 * b, "stroke-width": 5 }, { stroke: `var(--${p})` }));
          }
          continue;
        }
        if (!P[o.dst] || o.dst === o.src) continue;
        const [x2, y2] = P[o.dst], len = Math.hypot(x2 - x1, y2 - y1), cut = Math.min(18, len / 3);
        const ex = x2 - (x2 - x1) * cut / len, ey = y2 - (y2 - y1) * cut / len;
        const dash = o.kind === "support" ? "14 9" : o.kind === "convoy" ? "3 9" : "";
        ovl.appendChild(el("line", { x1, y1, x2: ex, y2: ey, "stroke-width": 10, "stroke-linecap": "round", "stroke-dasharray": dash }, { stroke: "#fff", opacity: .85 }));
        const ln = el("line", { x1, y1, x2: ex, y2: ey, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": dash }, { stroke: `var(--${p})` });
        if (o.kind === "move") ln.setAttribute("marker-end", `url(#ah-${p})`);
        ovl.appendChild(ln);
      }
    }
  }

  // The intention's "Aim:" line (or its first line of text), short, for the power card. Escaped where shown.
  function aimOf(t) {
    const lines = String(t || "").split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
    // Prefer the line that says what it's for (Aim, Goal, Target, Plan); never just its orders again.
    const label = /^(aim|goal|target|plan)\s*:\s*/i;
    const a = lines.find(l => label.test(l)) || lines.find(l => !/^orders\s*:/i.test(l)) || "";
    const s = a.replace(label, "").replace(/~~/g, "");
    return s.length > 140 ? s.slice(0, 139) + "…" : s;
  }

  function renderBar() {
    const c = S.control || {};
    $("phaseName").textContent = phaseLabel(S.phase);
    const st = $("state"); st.className = "state";
    if (S.final) { st.textContent = "game over"; st.classList.add("over"); }
    else if (c.stop) { st.textContent = "stopping"; st.classList.add("paused"); }
    else if (c.paused) { st.textContent = "paused"; st.classList.add("paused"); }
    // The clerk pauses itself at a usage limit (Rig, 2026-10-13; clerk role "Usage limits").
    else if (c.state === "paused-usage") { st.textContent = "Paused: usage limit"; st.classList.add("paused"); }
    // Resumed by the owner, but the clerk hasn't restarted the clock yet (it still says paused-operator). PL-045.
    else if (clerkHolds(c)) { st.textContent = "resuming: waiting for the clerk"; }
    else st.textContent = c.state || "waiting for clerk";
    $("btnPause").hidden = !!c.paused || S.final; $("btnResume").hidden = !c.paused || S.final;
    $("btnStop").disabled = S.final || !!c.stop;
    // Game over: point at the writeups, and show their tabs.
    $("postgame").hidden = !S.final;
    document.querySelectorAll("#tabs .post").forEach(b => b.hidden = !S.final);
    const history = !!S.live && S.phase !== S.live;   // looking at an earlier phase: say so, and offer the way back
    $("btnLive").hidden = !history;
    if (history) $("btnLive").textContent = `Back to live: ${phaseLabel(S.live)}`;
    if (history) { st.textContent = "earlier phase"; st.className = "state"; }
    tick();
  }
  function tick() {
    const c = S.control || {}; const el = $("clock"); el.className = "clock";
    // While the clerk's own state is a pause, its deadline is stale: the clock is held, nothing is adjudicating.
    if (clerkHolds(c) && !c.paused) { el.textContent = "clock held until the clerk restarts it"; return; }
    if (!c.deadline || c.paused || S.final || S.phase !== c.phase) { el.textContent = c.paused ? "clock stopped" : ""; return; }
    const ms = new Date(c.deadline) - Date.now();
    if (isNaN(ms)) { el.textContent = ""; return; }
    if (ms <= 0) { el.textContent = "deadline passed · adjudicating"; el.classList.add("over"); return; }
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    el.textContent = `${m}:${String(s).padStart(2,"0")} left`;
  }

  function renderPowers() {
    const b = S.board || {}; const units = b.units || {}, centers = b.centers || {};
    $("powers").innerHTML = POWERS.map(p => {
      const u = (units[p] || []).length, c = (centers[p] || []).length;
      const o = S.pending[p]; const live = S.control && S.phase === S.control.phase && !S.results;
      const ordersHtml = S.showOrders === false ? "" : (o ? `<span class="orders">${esc(o)}${live ? '<span class="live">pending</span>' : ""}</span>`
                               : (live ? `<span class="orders none">no orders written yet (holds)</span>` : ""));
      return `<button class="power ${S.sel===p?"sel":""} ${c===0&&u===0&&S.board?"out":""}" data-p="${p}">
        <span class="dot" style="background:var(--${p})"></span><span class="name">${nice(p)}</span>
        <span class="num"><b>${c}</b> centres · ${u} units</span>${ordersHtml}${
        S.showInt && S.intent?.[p] && aimOf(S.intent[p]) ? `<span class="aim"><b>Intention:</b> ${esc(aimOf(S.intent[p]))}</span>` : ""}</button>`;
    }).join("");
    $("powers").querySelectorAll(".power").forEach(el => el.onclick = () => openPower(el.dataset.p));
  }

  function allPress() {
    const seen = new Set(); const out = [];
    for (const m of [...S.press.map(m => ({...m, archived:true})), ...S.livePress]) {
      const k = `${m.phase}|${m.from}|${m.to}|${m.n}`; if (seen.has(k)) continue; seen.add(k); out.push(m);
    }
    return out.sort((a, b) => (a.ts || "").localeCompare(b.ts || "") || (a.n || 0) - (b.n || 0));
  }
  function msgHtml(m) {
    const from = String(m.from || "").toUpperCase(), to = String(m.to || "").toUpperCase();
    return `<div class="msg"><div class="who"><span class="tag" style="background:${colour(from)}"></span><span style="color:${colour(from)}">${esc(nice(from))}</span>
      <span class="arrow">→</span>${to === "ALL" ? '<span class="to">everyone</span>' : `<span class="tag" style="background:${colour(to)}"></span><span style="color:${colour(to)}">${esc(nice(to))}</span>`}${m.archived ? "" : '<span class="live">live</span>'}
      <span class="ph">${esc(m.phase || "")}${m.ts ? " · " + esc(String(m.ts).slice(11,16)) : ""}</span></div>
      <div class="text ${String(m.text||"").length > 280 || (m.text||"").split("\n").length > 3 ? "clamp" : ""}">${esc(m.text)}</div>
      ${String(m.text||"").length > 280 || (m.text||"").split("\n").length > 3 ? '<button class="more">show all</button>' : ""}</div>`;
  }
  document.addEventListener("click", e => {
    const b = e.target.closest(".more"); if (!b) return;
    const t = b.previousElementSibling; const open = t.classList.toggle("clamp"); b.textContent = open ? "show all" : "show less";
  });

  function renderPanel() {
    const P = $("panel"); const t = S.tab;
    $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
    if (t === "press") {
      const f = S.pressFilter || "";
      const msgs = allPress().filter(m => !f || String(m.from).toUpperCase() === f || String(m.to).toUpperCase() === f);
      if (S.pressOrder === "newest") msgs.reverse();
      const body = msgs.length ? msgs.map(msgHtml).join("") : `<div class="empty">No press yet this phase.</div>`;
      P.innerHTML = `<div class="filters">Show
        <select id="pf"><option value="">all powers</option>${POWERS.map(p => `<option value="${p}" ${f===p?"selected":""}>${nice(p)}</option>`).join("")}</select>
        <select id="po" aria-label="Order"><option value="oldest" ${S.pressOrder!=="newest"?"selected":""}>oldest first</option><option value="newest" ${S.pressOrder==="newest"?"selected":""}>newest first</option></select>
        <span>${msgs.length} message${msgs.length===1?"":"s"} in ${esc(phaseLabel(S.phase))} · conversations by pair are in each power's drawer</span></div>` + body;
      $("pf").onchange = e => { S.pressFilter = e.target.value; renderPanel(); };
      $("po").onchange = e => setOrder(e.target.value);
    } else if (t === "compare") {
      P.innerHTML = compareHtml();
    } else if (t === "final" || t === "chronicle" || t === "analysis") {
      // The postgame writeups, rendered with the console's escape-first Markdown reader (md.js): no raw HTML
      // from agents reaches the page. Chronicle from the game folder (/job/), the analysis from the one
      // read-only review endpoint. Loaded once, on first open.
      const src = { final: ["Final standings, written by the clerk", "board/final.md"],
                    chronicle: ["The chronicle, written by the game's chronicler", "chronicle/chronicle.md"],
                    analysis: ["The Model Architect's analysis of the game", `models/reviews/${JOB}/report.md`] }[t];
      const show = txt => { if (S.tab === t) P.innerHTML = txt == null ? `<div class="empty">Not written yet (${esc(src[1])}).</div>`
        : `<div class="filters">${esc(src[0])} · <span style="font-family:ui-monospace,monospace">${esc(src[1])}</span></div><div class="mdr">${md(txt)}</div>`; };
      if (t in S.post) show(S.post[t]);
      else {
        P.innerHTML = `<div class="empty">Loading…</div>`;
        (t === "final" ? text("board/final.md")
          : t === "chronicle" ? text("chronicle/chronicle.md")
          : fetch(`/api/models/review?id=${encodeURIComponent(JOB)}`, {cache: "no-store"}).then(r => r.json()).then(j => j.text ?? null).catch(() => null))
          .then(txt => { S.post[t] = txt; show(txt); });
      }
    } else if (t === "digest") {
      P.innerHTML = S.digest ? `<div class="filters">Digest of ${esc(phaseLabel(S.phase))}</div><div class="digest">${esc(S.digest)}</div>`
        : S.prev?.digest ? `<div class="filters"><b>Latest digest: ${esc(phaseLabel(S.prev.phase))}</b> · ${esc(phaseLabel(S.phase))} gets its own when the clerk adjudicates it.</div><div class="digest">${esc(S.prev.digest)}</div>`
        : `<div class="empty">The clerk writes a one-line-per-power digest when it adjudicates ${esc(phaseLabel(S.phase))}. Until then, the Press tab has the raw conversations.</div>`;
    } else if (t === "results") {
      P.innerHTML = S.results ? `<div class="filters">Results of ${esc(phaseLabel(S.phase))}</div><div class="md">${esc(S.results)}</div>`
        : S.prev?.results ? `<div class="filters"><b>Latest results: ${esc(phaseLabel(S.prev.phase))}</b> · ${esc(phaseLabel(S.phase))} is still being played.</div><div class="md">${esc(S.prev.results)}</div>`
        : `<div class="empty">Results appear when the clerk adjudicates ${esc(phaseLabel(S.phase))}.</div>`;
    } else if (t === "chart") {
      P.innerHTML = chartSvg();
    } else {
      P.innerHTML = S.incidents ? `<div class="md incident" style="padding-left:12px">${esc(S.incidents)}</div>` : `<div class="empty">No incidents recorded. (A power reading another's folder, writing outside its own, or using the web would appear here.)</div>`;
    }
  }

  // This phase across all seven powers: what each meant (sealed intention), what it ordered, how much it talked.
  function compareHtml() {
    const ph = S.phase;
    if (!ph || !PHASE_RE.test(ph)) return `<div class="empty">No phase yet.</div>`;
    const press = allPress();
    const cell = (t, empty) => t != null && t.trim() ? `<div class="md">${esc(t.trim())}</div>` : `<span class="seal">${empty}</span>`;
    return `<div class="filters">${esc(phaseLabel(ph))}. ${S.showInt ? esc(sealLabel()) + "." : "Intentions hidden (Show intentions is off)."}</div>
      <div class="cmp">${POWERS.map(p => { const o = S.pending[p], n = press.filter(m => power(m.from) === p).length; return `<div class="cmprow">
        <div class="cmpname"><b><span class="tag" style="background:var(--${p})"></span>${nice(p)}</b><span class="seal">${n} message${n === 1 ? "" : "s"} sent</span></div>
        ${S.showInt ? `<div><div class="who">Intention</div>${cell(S.intent?.[p], "none written")}</div>` : ""}
        <div><div class="who">Orders</div>${o != null && o ? `<pre>${esc(o)}</pre>` : `<span class="seal">${o != null ? "holds" : "none yet"}</span>`}</div>
      </div>`; }).join("")}</div>`;
  }

  function chartSvg() {
    const rows = S.timeline.filter(r => /A$|M$/.test(r.phase)); // movement and build phases carry centre counts
    const phases = [...new Set(rows.map(r => r.phase))];
    if (phases.length < 2) return `<div class="empty">The chart needs two adjudicated phases.</div>`;
    const W = 900, H = 220, L = 34, R = 10, T = 10, B = 28, maxC = 18;
    const x = i => L + (W - L - R) * i / (phases.length - 1), y = c => T + (H - T - B) * (1 - c / maxC);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Supply centres per power over time">`;
    for (const g of [0, 6, 12, 18]) s += `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${g}</text>`;
    phases.forEach((p, i) => { if (i % Math.ceil(phases.length / 8) === 0 || i === phases.length - 1) s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p)}</text>`; });
    for (const p of POWERS) {
      const pts = phases.map((ph, i) => { const r = rows.find(r => r.phase === ph && String(r.power).toUpperCase() === p); return r ? `${x(i)},${y(Math.min(maxC, r.centres ?? 0))}` : null; }).filter(Boolean);
      if (pts.length) s += `<polyline fill="none" stroke="var(--${p})" stroke-width="2.5" points="${pts.join(" ")}"/>`;
    }
    s += `</svg><div class="filters">${POWERS.map(p => `<span><span class="tag" style="background:var(--${p})"></span>${nice(p)}</span>`).join("")}</div>`;
    return s;
  }

  // One setter for the press order, so the Press tab and an open drawer always agree (review-18).
  function setOrder(v) {
    S.pressOrder = v === "newest" ? "newest" : "oldest";
    try { localStorage.setItem(ORDER_KEY, S.pressOrder); } catch { /* private window: this visit only */ }
    if (S.tab === "press") renderPanel();
    S.redrawConvo?.();
  }
  // Each drawer load has a generation. Opening, closing, a refresh and the intentions toggle each start a new
  // one, and a load writes to the page only while its generation is current. Checking the power alone let an
  // older load of the same power land after A -> B -> A (review-18).
  let drawerGen = 0;
  async function openPower(p, refresh = false) {
    const gen = ++drawerGen, showInt = S.showInt;
    S.sel = p; renderPowers();
    const D = $("drawer"); D.classList.add("open"); D.setAttribute("aria-hidden", "false");
    const b = S.board || {}; const units = (b.units || {})[p] || [], centers = (b.centers || {})[p] || [];
    const low = p.toLowerCase();
    // Open at once with what's already loaded; press, then the by-phase history, fill in as they arrive.
    const top = `<div class="head"><span class="dot" style="width:16px;height:16px;border-radius:50%;background:var(--${p})"></span><h1>${nice(p)}</h1><button id="closeD">Close</button></div>
      <dl class="kv"><dt>Centres</dt><dd>${centers.length}: ${esc(centers.join(" "))}</dd><dt>Units</dt><dd>${units.length}: ${esc(units.join(", "))}</dd></dl>
      <h2>Orders as written for ${esc(S.phase)}</h2>${S.pending[p] ? `<pre>${esc(S.pending[p])}</pre>` : '<div class="empty">Nothing written yet; the clerk will record holds.</div>'}`;
    const close = () => { drawerGen++; S.redrawConvo = null; D.classList.remove("open"); D.setAttribute("aria-hidden", "true"); S.sel = null; renderPowers(); };
    // A live refresh keeps what's on screen until the new content is ready (no "Loading" flash every refresh).
    if (!refresh) { D.innerHTML = top + `<h2>Press</h2><div class="empty">Loading press…</div>`; $("closeD").onclick = close; }
    // Every phase so far plus the one being played now (checked names only). Newest first for intentions and orders.
    const allPhases = [...new Set([...(S.index?.phases || []), S.control?.phase || "", S.phase || ""])].filter(ph => PHASE_RE.test(ph));
    const rowsP = Promise.all([...allPhases].reverse().map(async ph => {
      const [o, i] = await Promise.all([ordersFor(low, ph), showInt ? text(intentionPath(low, ph)) : null]);
      return [ph, o, i];
    }));
    // Every message this power sent or received, all phases: archived press plus each power's live sent.jsonl.
    const archived = (await Promise.all(allPhases.map(ph => jsonl(`archive/${ph}/press.jsonl`)))).flat().map(m => ({...m, archived:true}));
    const live = (await Promise.all(POWERS.map(w => jsonl(`powers/${w.toLowerCase()}/press/sent.jsonl`)))).flat();
    const seen = new Set(); const everything = [];
    for (const m of [...archived, ...live]) { const k = `${m.phase}|${m.from}|${m.to}|${m.n}`; if (!seen.has(k)) { seen.add(k); everything.push(m); } }
    const U = x => String(x || "").toUpperCase();
    const mine = everything.filter(m => U(m.from) === p || U(m.to) === p || U(m.to) === "ALL")
      .sort((a, b) => allPhases.indexOf(a.phase) - allPhases.indexOf(b.phase) || (a.ts || "").localeCompare(b.ts || "") || (a.n || 0) - (b.n || 0));
    const others = POWERS.filter(w => w !== p);
    const count = w => mine.filter(m => (U(m.from) === p && U(m.to) === w) || (U(m.from) === w && (U(m.to) === p || U(m.to) === "ALL"))).length;
    S.convo = S.convo && others.includes(S.convo) ? S.convo : "ALL";
    // Intentions are agent-written: escaped plain text, exactly like press. Never rendered as Markdown.
    const sealed = t => `<div class="who" style="margin-top:8px">${esc(sealLabel())}</div><div class="md">${esc(t.trim())}</div>`;
    const convoHtml = () => {
      const sel = S.convo;
      // Always a fresh list: reversing `mine` itself flipped the order on every redraw (review-18).
      const msgs = mine.filter(m => sel === "ALL" || (U(m.from) === p && U(m.to) === sel) || (U(m.from) === sel && (U(m.to) === p || U(m.to) === "ALL")));
      if (!msgs.length) return `<div class="empty">${sel === "ALL" ? "No press yet." : `Nothing between ${nice(p)} and ${nice(sel)} yet.`}</div>`;
      // The same oldest/newest choice as the Press tab (owner, 2026-10-15): one remembered setting for both.
      if (S.pressOrder === "newest") msgs.reverse();
      let out = '<div class="convo">', ph = null;
      for (const m of msgs) {
        if (m.phase !== ph) { ph = m.phase; out += `<div class="day">${esc(phaseLabel(ph))}</div>`; }
        const from = U(m.from), to = U(m.to), me = from === p;
        out += `<div class="bub ${me ? "me" : ""}" style="--who:${colour(from)}"><div class="hd">${esc(nice(from))}
          ${to === "ALL" ? '<span class="bc">to everyone</span>' : (sel === "ALL" ? `<span class="bc">→ ${esc(nice(to))}</span>` : "")}
          <span class="t">${m.ts ? esc(String(m.ts).slice(11,16)) : ""}${m.archived ? "" : " · live"}</span></div><div class="tx">${esc(m.text)}</div></div>`;
      }
      return out + "</div>";
    };
    const chipsHtml = () => `<div class="chips" id="chips"><button data-c="ALL" class="${S.convo==="ALL"?"on":""}">All<span class="cnt">${mine.length}</span></button>${
      others.map(w => `<button data-c="${w}" class="${S.convo===w?"on":""}"><span class="dot" style="background:var(--${w})"></span>${nice(w)}<span class="cnt">${count(w)}</span></button>`).join("")}</div>`;
    const orderHtml = () => `<div class="filters"><select id="dpo" aria-label="Press order"><option value="oldest" ${S.pressOrder!=="newest"?"selected":""}>oldest first</option><option value="newest" ${S.pressOrder==="newest"?"selected":""}>newest first</option></select></div>`;
    const rowsHtml = rows => rows.filter(([, o, i]) => o != null || i != null).map(([ph, o, i]) =>
        `<div class="msg"><div class="who">${esc(phaseLabel(ph))}${ph === S.control?.phase && !S.final ? ' <span class="live">this phase</span>' : ""}</div>${
        i != null ? sealed(i) : ""}${o != null ? `<div class="who" style="margin-top:8px">Orders</div><pre>${esc(o.trim() || "(no orders: holds)")}</pre>` : ""}</div>`).join("")
        || `<div class="empty">Nothing written yet${showInt ? "" : " (intentions are hidden: turn on Show intentions)"}.</div>`;
    // A refresh writes once, with everything, so nothing flashes or shifts; a fresh open shows press first.
    const early = refresh ? await rowsP : null;
    if (gen !== drawerGen) return;   // a newer load (another power, a close, a refresh) owns the drawer now
    const scroll = D.scrollTop;
    D.innerHTML = top + `<h2>Press</h2>${chipsHtml()}${orderHtml()}<div id="convo">${convoHtml()}</div>
      <h2>By phase: ${showInt ? "intention and orders" : "orders"}</h2><div id="byph">${early ? rowsHtml(early) : '<div class="empty">Loading…</div>'}</div>`;
    if (refresh) D.scrollTop = scroll;   // a live refresh doesn't move you
    $("closeD").onclick = close;
    // Each chip reads its own power when clicked. (The draft copied the first-clicked chip's handler onto the
    // redrawn chips, so after one click every chip selected that same power: owner report, 23:28Z.)
    const wire = () => $("chips").querySelectorAll("button").forEach(b => b.onclick = () => {
      S.convo = b.dataset.c; $("chips").outerHTML = chipsHtml(); $("convo").innerHTML = convoHtml(); wire(); });
    wire();
    $("dpo").onchange = e => setOrder(e.target.value);
    S.redrawConvo = () => { if (gen !== drawerGen || !$("convo")) return; $("dpo").value = S.pressOrder; $("convo").innerHTML = convoHtml(); };
    if (early) return;
    const rows = await rowsP;
    if (gen !== drawerGen || !$("byph")) return;
    $("byph").innerHTML = rowsHtml(rows);
  }

  async function control(body) {
    const btns = ["btnPause","btnResume","btnStop"].map($); btns.forEach(b => b.disabled = true);
    try {
      const r = await fetch("/api/lab/control", {method:"POST", headers:{"Content-Type":"application/json","X-Rig-Console":"1"}, body: JSON.stringify({job: JOB, ...body})});
      const j = await r.json().catch(() => ({}));
      $("note").textContent = r.ok ? (j.note || "Sent. The clerk acts on its next wake.") : `Refused: ${j.error || r.status}`;
    } catch (e) { $("note").textContent = "Could not reach the console."; }
    btns.forEach(b => b.disabled = false);
    await refresh();
  }
  $("btnPause").onclick = () => control({paused: true});
  $("btnResume").onclick = () => control({paused: false});
  $("btnStop").onclick = () => { if (confirm("End the game after the current phase? The clerk finishes adjudication, writes final standings and tells every power.")) control({stop: true}); };
  // Picking the live phase (or Back to live) resumes following; picking an earlier one holds the page there.
  $("phaseSel").onchange = async e => { S.phase = e.target.value; S.follow = S.phase === S.live; await loadPhase(); renderAll(true); };
  $("btnLive").onclick = async () => { S.follow = true; S.phase = S.live; $("phaseSel").value = S.phase; await loadPhase(); renderAll(true); };
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderAll(true); });
  $("postgame").querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    S.tab = b.dataset.go; renderAll(true); $("tabs").scrollIntoView({behavior: "smooth", block: "start"}); });
  $("intToggle").checked = S.showInt;
  $("intToggle").onchange = async e => {
    S.showInt = e.target.checked;
    try { localStorage.setItem(INT_KEY, S.showInt ? "on" : "off"); } catch { /* private window: this visit only */ }
    await loadPhase(); renderAll(true); if (S.sel) openPower(S.sel, true);
  };

  function fingerprint() {
    return JSON.stringify([S.phase, S.control, S.board, S.press.length, S.livePress.map(m => [m.from, m.to, m.n, m.phase]), S.results, S.digest, S.prev, S.incidents, S.final, S.pending, S.intent, S.showInt, S.boardStamp, !!S.geo, S.timeline.length, S.tab, S.pressFilter, S.pressOrder]);
  }
  function renderAll(force) {
    const fp = fingerprint();
    renderBar();                                   // cheap, text only; the countdown ticks separately
    if (!force && fp === S.lastFp) return;         // nothing changed: leave the DOM alone
    S.lastFp = fp;
    const y = window.scrollY;
    renderPowers(); renderPanel(); renderMap();
    window.scrollTo(0, y);                         // a re-render shouldn't move you
  }
  async function refresh() {
    await loadStatic();                              // moves S.phase to the live phase while following
    $("phaseSel").value = S.phase;
    await loadPhase(); renderAll();
  }
  refresh();
  setInterval(tick, 1000);
  // An open drawer refreshes too, so its live press keeps up (review-18); it keeps its scroll and conversation.
  setInterval(async () => { if (document.hidden) return; await refresh(); if (S.sel) openPower(S.sel, true); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
