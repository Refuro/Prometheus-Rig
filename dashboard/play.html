<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f17" media="(prefers-color-scheme: dark)">
<title>Play builds · Rig Console</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/notify.js"></script>
<script src="/health.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f4;--surface:#f7f9fb;--raised:#fff;--ink:#152033;--muted:#5d687a;--faint:#8a94a4;--line:#d7dde5;--signal:#c98200;--font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0a0f17;--surface:#0f1621;--raised:#141d2a;--ink:#e3e8ef;--muted:#8e9aac;--faint:#5d6a7e;--line:#212c3c;--signal:#f0b23c}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
header{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;font-weight:800;flex:1}
header a{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none}
main{max-width:900px;margin:0 auto;padding:16px 14px 40px}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:20px 2px 8px}
.b{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.b .t{flex:1;min-width:0}
.b b{display:block;font-size:15.5px}
.b span{display:block;font-size:13px;color:var(--muted)}
.b.fresh{border-color:color-mix(in srgb,var(--signal) 55%,var(--line))}
.play{all:unset;cursor:pointer;font-weight:800;font-size:14.5px;color:#111;background:var(--signal);padding:10px 16px;border-radius:12px;white-space:nowrap}
.empty{color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.empty code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink)}
</style>
</head>
<body>
<script src="/nav.js"></script>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { const s = Date.now()/1000 - t; return s < 60 ? "just now" : s < 3600 ? `${Math.round(s/60)} min ago` : s < 86400 ? `${Math.round(s/3600)} h ago` : new Date(t*1000).toLocaleDateString(); };
async function load(){
  let bs = [];
  try { bs = await (await fetch("/api/builds", {cache: "no-store"})).json(); } catch { $("main").innerHTML = `<div class="empty">Couldn't reach the dashboard.</div>`; return; }
  if (!bs.length){
    $("main").innerHTML = `<div class="empty">No playable builds yet. Builders put each Godot web export in <code>&lt;job&gt;/builds/&lt;name&gt;/</code> (with its <code>index.html</code>), and it shows up here.</div>`; return;
  }
  const groups = {}; bs.forEach(b => (groups[b.job] ||= []).push(b));
  $("main").innerHTML = Object.entries(groups).map(([job, list]) => `<h2>${esc(job)}</h2>` + list.map(b => `
    <div class="b ${Date.now()/1000 - b.updated < 3600 ? "fresh" : ""}"><div class="t"><b>${esc(b.name)}</b><span>Built ${esc(ago(b.updated))} · ${b.size_mb} MB</span></div>
    <a class="play" href="${esc(b.url)}" target="_blank" rel="noopener">▶ Play</a></div>`).join("")).join("");
}
load(); setInterval(() => { if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
