<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f17" media="(prefers-color-scheme: dark)">
<title>Decisions · Rig Console</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/notify.js"></script>
<script src="/health.js"></script>
<script src="/md.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f4;--surface:#f7f9fb;--raised:#fff;--ink:#152033;--muted:#5d687a;--faint:#8a94a4;--line:#d7dde5;--signal:#c98200;--signal-soft:#fbf0d9;--cut:#c2412b;--cut-soft:#fbe5e0;--ok:#2e9d62;--ok-soft:#e1f3e8;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0a0f17;--surface:#0f1621;--raised:#141d2a;--ink:#e3e8ef;--muted:#8e9aac;--faint:#5d6a7e;--line:#212c3c;--signal:#f0b23c;--signal-soft:#2f2511;--cut:#f0765c;--cut-soft:#311a16;--ok:#3cb371;--ok-soft:#12261b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
a{color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;flex:1}
header a{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:16px 14px 140px}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:20px 2px 8px}
.list a{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.list a.open{border-color:color-mix(in srgb,var(--signal) 55%,var(--line));background:var(--signal-soft)}
.list b{display:block;font-size:15px}
.list span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-right:6px}
.gh h3{margin:10px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.gh p{margin:4px 0 0;color:var(--muted);font-size:15px;white-space:pre-wrap}
.gh .ctx{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--signal)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}
.opt{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt.ro{cursor:default}
.opt.on{border-color:var(--signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 22%,transparent)}
.opt .img{position:relative;aspect-ratio:16/9;background:var(--raised) center/cover no-repeat;border-bottom:1px solid var(--line)}
.zoom{all:unset;cursor:zoom-in;position:absolute;left:10px;bottom:10px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;font-size:18px;color:#fff;background:rgba(0,0,0,.55)}
.opt .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.opt .t{display:flex;gap:8px;align-items:flex-start}
.opt .t b{font-size:16px;flex:1}
.opt .id{font-size:12px;color:var(--faint);font-weight:600}
.opt .sum{font-size:14px;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.opt .sum.full{display:block}
.opt .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.badge{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--raised);border:1.5px solid var(--line);color:var(--faint)}
.opt.on .badge{background:var(--signal);border-color:var(--signal);color:#111}
.btn{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.btn:hover{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .cnt{font-weight:700;font-size:14.5px;flex:1;min-width:140px}
.bar .cnt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.bar textarea{flex-basis:100%;order:-1;min-height:64px;resize:vertical;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.4 var(--font)}
.go{all:unset;cursor:pointer;font-weight:800;font-size:15px;color:#111;background:var(--signal);padding:11px 20px;border-radius:12px}
.go.ok{background:var(--ok);color:#fff}
.go[aria-disabled="true"]{opacity:.45;cursor:default}
.err{color:var(--cut);font-size:13.5px;flex-basis:100%}
.done{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:16px;padding:16px;margin-top:16px}
.done b{font-size:16px}
.done p{margin:6px 0 0;color:var(--muted);white-space:pre-wrap}
.empty{color:var(--faint);padding:14px 2px}
/* Rendered documents */
.doc{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.doc > .dh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.doc > .dh b{flex:1;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.doc > .db{padding:4px 18px 16px;max-height:62vh;overflow:auto}
.doc.full > .db{max-height:none}
.md{font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.md h2,.md h3,.md h4{margin:18px 0 6px;line-height:1.3;text-transform:none;letter-spacing:0;color:var(--ink)}
.md h2{font-size:19px} .md h3{font-size:16.5px} .md h4,.md h5,.md h6{font-size:15px}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:22px} .md li{margin:3px 0} .md li.sub{margin-left:20px}
.md code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.md pre{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--signal);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md a{color:var(--signal);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.md a.fref{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:500}
.md a.dead{color:var(--muted);text-decoration:none;cursor:default}
.md .tbl{overflow:auto;margin:10px 0}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--raised)}
.md .muted{color:var(--faint)}
.reader{position:fixed;inset:0;z-index:40;display:none;background:color-mix(in srgb,#000 50%,transparent)}
.reader.open{display:flex;justify-content:flex-end}
.reader .panel{width:min(820px,100%);height:100%;display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--line)}
.reader .rh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.reader .rh b{flex:1;min-width:0;font:600 13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader .rb{flex:1;overflow:auto;padding:6px 22px calc(30px + env(safe-area-inset-bottom))}
@media (max-width:700px){.bar .cnt{flex-basis:100%}.bar .in > .btn,.bar .go{flex:1;text-align:center}}
.viewer{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.viewer .cap{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:700}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px}
</style>
</head>
<body>
<script src="/nav.js"></script>
<span id="h" hidden></span>
<main id="main"><div class="empty">Loading…</div></main>
<div class="bar" id="bar" hidden></div>
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="rdTitle"><div class="panel">
  <div class="rh"><button class="btn" id="rdBack" type="button" hidden>← Back</button><b id="rdTitle"></b><a class="btn" id="rdRaw" target="_blank" rel="noopener">Raw</a><button class="btn" id="rdClose" type="button">Close</button></div>
  <div class="rb md" id="rdBody"></div></div></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true"><img id="vImg" alt=""><div class="cap" id="vCap"></div><button class="btn" id="vClose" type="button">Close</button></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q = new URLSearchParams(location.search), JOB = q.get("job"), GATE = q.get("gate");
const phone = matchMedia("(max-width: 700px)").matches;
const when = s => { try { return new Date(s).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); } catch { return s; } };
let gates = null, gate = null, chosen = [], note = "";
let overOk = false;   // R-001: the second tap that confirms going over a soft maximum

async function load(){
  try { gates = await (await fetch("/api/gates", {cache: "no-store"})).json(); }
  catch { $("main").innerHTML = `<div class="empty">Couldn't reach the dashboard.</div>`; return; }
  if (JOB && GATE){
    gate = [...gates.open, ...gates.decided].find(g => g.job === JOB && g.id === GATE);
    return gate ? showGate() : ($("main").innerHTML = `<div class="empty">That decision isn't open any more. <a href="/decide.html">See all decisions</a></div>`);
  }
  showList();
}
function showList(){
  $("bar").hidden = true;
  const row = (g, open) => `<a class="${open ? "open" : ""}" href="/decide.html?job=${encodeURIComponent(g.job)}&gate=${encodeURIComponent(g.id)}"><b>${esc(g.title)}</b><span>${esc(g.job)}${open ? " · waiting for you" : " · decided " + esc(when(g.decision.decided_at))}</span></a>`;
  $("main").innerHTML = `<h2>Waiting for you</h2><div class="list">${gates.open.map(g => row(g, true)).join("") || `<div class="empty">Nothing to decide right now.</div>`}</div>
    ${gates.decided.length ? `<h2>Recently decided</h2><div class="list">${gates.decided.map(g => row(g, false)).join("")}</div>` : ""}
    ${gates.errors.length ? `<h2>Couldn't read</h2><div class="list">${gates.errors.map(g => `<a><b>${esc(g.job)}</b><span>${esc(g.error)}</span></a>`).join("")}</div>` : ""}`;
}
function showGate(){
  const g = gate, choose = g.kind === "choose", ro = !g.open || !choose;
  $("h").textContent = g.open ? "Your decision" : "Decision";
  $("main").innerHTML = `<div class="gh"><a href="/decide.html" class="chip" style="text-decoration:none">← All</a><span class="chip">${esc(g.job)}</span>${g.job_type ? `<span class="chip">${esc(g.job_type)}</span>` : ""}
      <h3>${esc(g.title)}</h3>${g.question ? `<p>${esc(g.question)}</p>` : ""}${g.play ? `<p><a class="btn" href="${esc(g.play)}" target="_blank" rel="noopener">▶ Play this build</a></p>` : ""}</div>
    ${g.context ? `<section class="doc" id="ctxDoc"><div class="dh"><b>Background</b><button class="btn" id="ctxFull" type="button">Show all</button><button class="btn" id="ctxPop" type="button">Open reader</button></div><div class="db md" id="ctxBody"></div></section>` : ""}
    ${!g.open ? doneHtml(g.decision) : ""}
    <div class="opts">${g.options.map((o, i) => `<div class="opt ${ro ? "ro" : ""}" data-id="${esc(o.id)}" ${ro ? "" : `role="button" tabindex="0" aria-pressed="false"`}>
      ${o.image ? `<div class="img" style="background-image:url('${esc(o.image)}')"><button class="zoom" data-i="${i}" type="button" aria-label="View ${esc(o.title)} full screen">⤢</button></div>` : ""}
      ${choose && g.open ? `<span class="badge" aria-hidden="true"></span>` : ""}
      <div class="bd"><div class="t"><b>${esc(o.title)}</b></div><span class="id">${esc(o.id)}</span>
        ${o.summary ? `<div class="sum">${esc(o.summary)}</div>` : ""}
        <div class="acts">${o.summary && o.summary.length > 260 ? `<button class="btn more" type="button">More</button>` : ""}
          ${o.file ? `<a class="btn read" href="${esc(o.file)}" data-file="${esc(o.file)}">Read</a>` : ""}
          ${o.play ? `<a class="btn" href="${esc(o.play)}" target="_blank" rel="noopener">▶ Play</a>` : ""}</div></div></div>`).join("")}</div>`;
  document.querySelectorAll(".opt .more").forEach(b => b.onclick = e => { e.stopPropagation(); const s = b.closest(".bd").querySelector(".sum"); s.classList.toggle("full"); b.textContent = s.classList.contains("full") ? "Less" : "More"; });
  document.querySelectorAll(".opt a").forEach(a => a.onclick = e => { e.stopPropagation(); if (a.dataset.file){ e.preventDefault(); openReader(a.dataset.file, true); } });
  if (g.context){
    renderInto($("ctxBody"), g.context);
    $("ctxFull").onclick = () => { const d = $("ctxDoc"); d.classList.toggle("full"); $("ctxFull").textContent = d.classList.contains("full") ? "Collapse" : "Show all"; };
    $("ctxPop").onclick = () => openReader(g.context, true);
  }
  document.querySelectorAll(".opt .zoom").forEach(el => el.onclick = e => { e.stopPropagation(); view(+el.dataset.i); });
  if (ro) document.querySelectorAll(".opt .img").forEach(el => { el.style.cursor = "zoom-in"; el.onclick = () => el.querySelector(".zoom").click(); });
  if (g.open && choose){
    document.querySelectorAll(".opt[role=button]").forEach(el => {
      el.onclick = () => toggle(el.dataset.id);
      el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(el.dataset.id); } };
    });
  }
  if (g.open) bar(); else $("bar").hidden = true;
  paint();
}
function doneHtml(d){
  if (!d) return "";
  const what = d.verdict === "closed" ? "Closed without deciding here" : d.kind === "approve" ? (d.verdict === "approve" ? "Approved" : "Sent back for changes") : `Chose ${d.chosen.length}: ${d.chosen.join(", ")}`;
  return `<div class="done"><b>${esc(what)}</b><p>Decided ${esc(when(d.decided_at))}${d.note ? "\n\n" + esc(d.note) : ""}</p></div>`;
}
function toggle(id){
  const i = chosen.indexOf(id);
  if (i >= 0) chosen.splice(i, 1);
  else {
    if (gate.max === 1 && !gate.max_soft) chosen = [];
    if (chosen.length >= gate.max && !gate.max_soft) return flash(`You can pick up to ${gate.max}. Unpick one first.`);
    chosen.push(id);
  }
  overOk = false;
  paint();
}
function paint(){
  document.querySelectorAll(".opt[data-id]").forEach(el => {
    const k = chosen.indexOf(el.dataset.id); el.classList.toggle("on", k >= 0); el.setAttribute("aria-pressed", k >= 0);
    const b = el.querySelector(".badge"); if (b) b.textContent = k >= 0 ? k + 1 : "";
  });
  if (!gate.open) return;
  const c = $("cnt"), go = $("go");
  if (gate.kind === "choose"){
    const want = gate.min === gate.max ? `${gate.max}` : `${gate.min}–${gate.max}`, over = gate.max_soft && chosen.length > gate.max;
    const ok = chosen.length >= gate.min && (chosen.length <= gate.max || over);
    c.innerHTML = `${chosen.length} of ${want} picked<small>${over ? `<b style="color:var(--signal)">${chosen.length - gate.max} over the limit. This gate lets you, with a confirm.</b>` : chosen.length ? "Order matters: first picked goes first." : "Tap options to pick them."}</small>`;
    go.setAttribute("aria-disabled", !ok);
    go.textContent = over ? (overOk ? `Confirm: send ${chosen.length} (limit ${gate.max})` : `Send ${chosen.length}, over the limit`) : "Send decision";
  }
}
function bar(){
  const b = $("bar"); b.hidden = false;
  b.innerHTML = gate.kind === "choose"
    ? `<div class="in"><textarea id="note" placeholder="Notes for the team (optional)"></textarea><div class="cnt" id="cnt"></div><button class="btn" id="close" type="button" title="Already decided elsewhere, or the team is gone">Close without deciding</button><button class="go" id="go" type="button">Send decision</button><div class="err" id="err"></div></div>`
    : `<div class="in"><textarea id="note" placeholder="Notes (required if you send it back)"></textarea><div class="cnt" id="cnt">Approve, or send it back with what to change.</div><button class="btn" id="close" type="button" title="Already decided elsewhere, or the team is gone">Close without deciding</button><button class="btn" id="back" type="button">Send back</button><button class="go ok" id="go" type="button">Approve</button><div class="err" id="err"></div></div>`;
  $("note").value = note; $("note").oninput = e => note = e.target.value;
  $("go").onclick = () => {
    // Going over a soft maximum takes a second, deliberate tap (R-001).
    if (gate.kind === "choose" && gate.max_soft && chosen.length > gate.max && !overOk){ overOk = true; paint(); return flash("Tap again to confirm going over the limit."); }
    submit(gate.kind === "choose" ? {chosen, over_max: gate.max_soft && chosen.length > gate.max} : {verdict: "approve"});
  };
  if ($("back")) $("back").onclick = () => submit({verdict: "send_back"});
  $("close").onclick = () => {
    if (!confirm("Close this without a decision? Use this when you already decided elsewhere or the team is gone. Nobody gets messaged.")) return;
    submit({close: true}, true);
  };
}
let flashT;
function flash(t){ const e = $("err"); if (!e) return; e.textContent = t; clearTimeout(flashT); flashT = setTimeout(() => e.textContent = "", 4000); }
async function submit(body, force){
  if (!force && $("go").getAttribute("aria-disabled") === "true") return flash(gate.min === gate.max ? `Pick exactly ${gate.max}.` : `Pick ${gate.min}–${gate.max}.`);
  body.note = note;
  $("go").setAttribute("aria-disabled", "true");
  try {
    const r = await (await fetch(`/api/gate?job=${encodeURIComponent(gate.job)}&gate=${encodeURIComponent(gate.id)}`, {method: "POST",
      headers: {"Content-Type": "application/json", "X-Rig-Console": "1"}, body: JSON.stringify(body)})).json();
    if (r.error){ flash(r.error); $("go").setAttribute("aria-disabled", "false"); return; }
    $("bar").hidden = true;
    $("main").insertAdjacentHTML("afterbegin", body.close ? `<div class="done" style="margin:0 0 14px"><b>Closed.</b><p>It's off your list. Nobody was messaged.</p></div>` : `<div class="done" style="margin:0 0 14px"><b>Decision sent.</b><p>${r.lead_notified ? `${esc(r.lead.split("@")[0])} was told and will pick it up from the decision file.` : "Saved to the job's decisions folder, but the lead couldn't be messaged. Tell the operator it's there."}</p></div>`);
    scrollTo({top: 0, behavior: "smooth"});
    setTimeout(load, 1200);
  } catch { flash("Couldn't reach the dashboard."); $("go").setAttribute("aria-disabled", "false"); }
}
// Full-screen image viewer: tap an image; arrows or swipe to move between options.
let vi = 0, imgs = [];
function view(i){ imgs = gate.options.map((o, k) => [k, o]).filter(([, o]) => o.image); vi = Math.max(0, imgs.findIndex(([k]) => k === i)); show(); $("viewer").classList.add("open"); }
function show(){ const [, o] = imgs[vi]; $("vImg").src = o.image; $("vImg").alt = o.title; $("vCap").textContent = `${o.title}  ·  ${vi + 1}/${imgs.length}`; }
$("vClose").onclick = () => $("viewer").classList.remove("open");
$("viewer").onclick = e => { if (e.target.id === "viewer") $("viewer").classList.remove("open"); };
document.addEventListener("keydown", e => {
  if (!$("viewer").classList.contains("open")) return;
  if (e.key === "Escape") $("viewer").classList.remove("open");
  if (e.key === "ArrowRight"){ vi = (vi + 1) % imgs.length; show(); }
  if (e.key === "ArrowLeft"){ vi = (vi - 1 + imgs.length) % imgs.length; show(); }
});
let tx = null;
$("viewer").addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive: true});
$("viewer").addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50){ vi = (vi + (dx < 0 ? 1 : -1) + imgs.length) % imgs.length; show(); } });
// The Markdown renderer (md, mdInline) lives in /md.js, shared with the job page (PL-034).

// ---------- Reader: open any file of this job inside the page
function resolveRef(ref, fromUrl){
  const job = gate.job, root = `/job/${job}/`;
  let r = String(ref).trim().replace(/^~\/openrig\/(research|jobs)\//, "/");
  const k = r.indexOf(`${job}/`);
  if (k >= 0 && (k === 0 || r[k - 1] === "/")) return root + r.slice(k + job.length + 1);   // repo-style path that names the job
  if (r.startsWith("/")) return null;
  // "plan/offer.md" means from the job folder (how agents write paths); "offer.md", "./x" and "../x" are relative to this file.
  const fromRoot = r.includes("/") && !/^\.\.?\//.test(r);
  const base = !fromRoot && fromUrl && fromUrl.startsWith(root) ? fromUrl : root;
  const u = new URL(r, location.origin + base);
  return u.pathname.startsWith(root) ? u.pathname : null;
}
async function renderInto(el, url){
  el.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const r = await fetch(url, {cache: "no-store"});
    if (!r.ok){ el.innerHTML = `<p class="muted">Couldn't open this file (${r.status}). It may have moved.</p>`; return false; }
    const text = await r.text(), name = url.split("/").pop();
    el.innerHTML = /\.md$|\.txt$/i.test(name) ? md(text) : `<pre>${esc(/\.json$/i.test(name) ? (() => { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; } })() : text)}</pre>`;
    el.querySelectorAll("a.fref").forEach(a => {
      const target = resolveRef(a.dataset.f, url);
      if (!target){ a.classList.add("dead"); return; }
      a.href = target; a.onclick = e => { e.preventDefault(); openReader(target); };
    });
    return true;
  } catch { el.innerHTML = `<p class="muted">Couldn't reach the dashboard.</p>`; return false; }
}
const readerStack = [];
function openReader(url, fresh){
  if (fresh) readerStack.length = 0;
  readerStack.push(url);
  $("rdTitle").textContent = decodeURIComponent(url.replace(`/job/${gate.job}/`, ""));
  $("rdRaw").href = url; $("rdBack").hidden = readerStack.length < 2;
  $("reader").classList.add("open"); document.body.style.overflow = "hidden";
  renderInto($("rdBody"), url).then(() => $("rdBody").scrollTop = 0);
}
function closeReader(){ $("reader").classList.remove("open"); document.body.style.overflow = ""; readerStack.length = 0; }

$("rdClose").onclick = closeReader;
$("rdBack").onclick = () => { readerStack.pop(); const u = readerStack.pop(); if (u) openReader(u); };
$("reader").onclick = e => { if (e.target.id === "reader") closeReader(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("reader").classList.contains("open")) closeReader(); });
load();
</script>
