<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var q=location.search;if(/desktop=1/.test(q))sessionStorage.setItem("rcDesktop","1");else if(matchMedia("(max-width: 700px)").matches&&!sessionStorage.getItem("rcDesktop"))location.replace("/m.html"+q.replace(/([?&])token=[^&]*&?/,"$1").replace(/[?&]$/,""))}catch(e){}</script>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">

<title>Rig Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --surface:#f7f9fb; --raised:#fff; --ink:#152033; --muted:#5d687a; --faint:#8a94a4;
  --line:#d7dde5; --signal:#c98200; --signal-soft:#fbf0d9; --cut:#c2412b; --cut-soft:#fbe5e0; --idle:#c7cfd8; --good:#2e8b57; --good-soft:#e1f2e8;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0a0f17; --surface:#0f1621; --raised:#141d2a; --ink:#e3e8ef; --muted:#8e9aac; --faint:#5d6a7e;
  --line:#212c3c; --signal:#f0b23c; --signal-soft:#2f2511; --cut:#f0765c; --cut-soft:#311a16; --idle:#344257; --good:#5cc28a; --good-soft:#12291e;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
button{font:inherit}
/* top bar, shared look with the graph */
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.bar h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.bar nav{display:flex;gap:14px}
.bar nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px}
.bar nav a:hover,.bar nav a[aria-current]{color:var(--ink)}
.bar select{background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13.5px}
.spacer{flex:1}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;padding:20px 22px 60px;align-items:start}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}}
/* heading */
.head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.head p{margin:6px 0 0;color:var(--muted);max-width:90ch}
.head .fresh{font-size:12.5px;color:var(--faint);margin-top:6px}
.banner{display:none;align-items:flex-start;gap:12px;border-radius:12px;padding:12px 14px;margin-top:14px}
.banner.show{display:flex}
.banner .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.banner b{display:block}
.banner span{color:var(--muted);font-size:13.5px}
.banner a{margin-left:auto;font-weight:650;font-size:13.5px;white-space:nowrap}
.banner code{font-size:12.5px;background:var(--raised);border:1px solid var(--line);padding:1px 6px;border-radius:6px;user-select:all}
.banner.red{background:var(--cut-soft);border:1px solid color-mix(in srgb,var(--cut) 45%,transparent)} .banner.red .dot{background:var(--cut)} .banner.red b{color:var(--cut)}
.banner.amber{background:var(--signal-soft);border:1px solid color-mix(in srgb,var(--signal) 45%,transparent)} .banner.amber .dot{background:var(--signal)}
/* funnel as three stages */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 6px}
.stage{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.stage.now{border-color:color-mix(in srgb,var(--signal) 70%,transparent)}
.stage.waiting{border-color:var(--cut)}
.stage .top{display:flex;justify-content:space-between;align-items:baseline}
.stage b{font-size:13.5px}
.stage .tag{font-size:12px;font-weight:650;color:var(--faint)}
.stage.now .tag{color:var(--signal)} .stage.waiting .tag{color:var(--cut)} .stage.done .tag{color:var(--good)}
.stage .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stage .big small{font-size:14px;font-weight:600;color:var(--faint);letter-spacing:0}
.stage .meter{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.stage .meter i{display:block;height:100%;background:var(--muted)}
.stage.now .meter i{background:var(--signal)} .stage.done .meter i{background:var(--good)}
.stage .sub{font-size:12.5px;color:var(--faint);margin-top:6px}
.cutline{font-size:13px;color:var(--muted)}
.cutline b{color:var(--cut)}
/* niches */
.sec{margin-top:24px}
.sec h3{margin:0 0 10px;font-size:15px;font-weight:750;display:flex;gap:8px;align-items:baseline}
.sec h3 span{font-size:13px;color:var(--faint);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start}
.niche{background:var(--raised);border:1px solid var(--line);border-radius:12px}
.niche.top{border-left:3px solid var(--good)} .niche.short{border-left:3px solid var(--signal)}
.niche.picked{box-shadow:0 0 0 2px var(--signal)}
.niche>button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;width:100%;box-sizing:border-box}
.niche>button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px;border-radius:12px}
.nn{font-weight:700;line-height:1.3}
.nl{grid-column:1;font-size:13px;color:var(--muted);line-height:1.45}
.sig{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tot{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tot small{font-size:11.5px;color:var(--faint);font-weight:500}
.glyph{display:flex;gap:2px;align-items:flex-end;height:18px}
.glyph i{width:5px;border-radius:1.5px;background:var(--good)}
.glyph i.none{background:var(--line);height:3px!important}
.nid{font-size:11.5px;font-weight:600;color:var(--faint)}
.badges{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.badge{font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.bad{color:var(--cut);border-color:color-mix(in srgb,var(--cut) 55%,transparent);background:var(--cut-soft)}
.badge.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.detail{display:none;padding:0 14px 14px;font-size:13.5px}
.niche.open .detail{display:block}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;margin:2px 0 10px}
.scores div{display:flex;justify-content:space-between;color:var(--muted)} .scores b{color:var(--ink)}
.why{margin:0 0 8px}
.skeptic{margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--cut-soft)}
.skeptic b{color:var(--cut)}
.src{display:flex;flex-direction:column;gap:3px}
.src a{color:var(--muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a:hover{color:var(--ink);text-decoration:underline}
.src a.dead{color:var(--cut);text-decoration:line-through}
.meta{margin-top:8px;font-size:12px;color:var(--faint)}
.pick{display:flex;flex-direction:column;gap:8px;padding:0 14px 12px}
.pickbtn{all:unset;cursor:pointer;align-self:flex-start;font-size:13px;font-weight:650;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pickbtn:hover{color:var(--ink)}
.niche.picked .pickbtn{background:var(--signal);border-color:var(--signal);color:#1b1300}
textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;width:100%}
textarea:focus{outline:2px solid var(--signal);outline-offset:0;border-color:transparent}
.decision{position:sticky;bottom:12px;margin-top:18px;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:none;gap:14px;align-items:flex-end;box-shadow:0 10px 30px color-mix(in srgb,#000 25%,transparent)}
.decision.show{display:flex}
.decision .dl{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.decision .order{font-size:13px;color:var(--muted)}
.sendbtn{all:unset;cursor:pointer;background:var(--signal);color:#1b1300;font-weight:700;padding:10px 16px;border-radius:10px;white-space:nowrap}
.sendbtn[disabled]{opacity:.45;cursor:not-allowed}
.sent{font-size:13px;color:var(--good);font-weight:600} .sent.err{color:var(--cut)}
details.cuts{margin-top:18px}
details.cuts summary{cursor:pointer;font-weight:700}
details.cuts summary span{color:var(--faint);font-weight:500}
.cutrow{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.cutrow span{color:var(--muted)}
.outcome{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted)}
.outcome b{color:var(--ink)}
.outcome a{color:var(--ink);font-weight:650}
.empty{font-size:13.5px;color:var(--faint);padding:12px;border:1px dashed var(--line);border-radius:10px}
/* team column */
aside .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:70px}
aside h3{margin:0 0 10px;font-size:15px;font-weight:750;display:flex;justify-content:space-between;align-items:baseline}
aside h3 a{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none}
.team{margin-bottom:12px}
.team .tn{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 6px;display:flex;justify-content:space-between}
.team .tn span{font-weight:500;color:var(--faint)}
.agent{display:grid;grid-template-columns:10px 1fr auto;gap:2px 9px;align-items:center;padding:7px 9px;border-radius:9px;background:var(--raised);border:1px solid var(--line);margin-bottom:6px;text-decoration:none}
.agent .d{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.agent.working{border-color:color-mix(in srgb,var(--signal) 55%,transparent)} .agent.working .d{background:var(--signal)}
.agent.blocked{border-color:var(--cut);background:var(--cut-soft)} .agent.blocked .d{background:var(--cut)}
.agent.idle{opacity:.75}
.agent b{font-size:13px}
.agent .rt{font-size:11px;color:var(--faint);font-weight:600}
.agent .a{grid-column:2/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent.blocked .a{color:var(--cut);font-weight:600}
.alertsbox{margin-bottom:10px}
.allclear{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--raised)}
.allclear i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.al{display:block;text-decoration:none;padding:8px 10px;border-radius:9px;margin-bottom:6px;background:var(--cut-soft);border:1px solid color-mix(in srgb,var(--cut) 40%,transparent);font-size:13px}
.al b{color:var(--cut)}
.al.warn{background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 40%,transparent)} .al.warn b{color:var(--signal)}
.foot{margin-top:12px}
@media (max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.wrap{padding:14px 12px 40px}.stages{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.decision{flex-direction:column;align-items:stretch}}
</style>
<script src="/notify.js"></script>
<script src="/health.js"></script>
</head>
<body>
<script src="/nav.js"></script>
<select id="runSel" aria-label="Run" data-rc-tools></select>
<div class="wrap">
  <main>
    <div class="head"><h2 id="title">Loading</h2><p id="note"></p><div class="fresh" id="fresh"></div></div>
    <div class="banner red" id="approve" role="alert"></div>
    <div class="banner amber" id="yourturn" role="status"><div class="dot"></div><div><b>Your turn: choose which niches go further</b><span>The team stopped at a checkpoint. Choose cards below, add notes if you like, then send your decision at the bottom.</span></div></div>
    <div class="stages" id="stages"></div>
    <div class="cutline" id="cutline"></div>
    <div id="groups"></div>
    <div class="decision" id="decision" aria-live="polite"></div>
    <details class="cuts" id="cutbox"><summary>Cut <span id="cutCount"></span></summary><div id="cuts"></div></details>
  </main>
  <aside><div class="panel">
    <h3>Team <a href="/graph.html">Open graph</a></h3>
    <div class="alertsbox" id="alerts"></div>
    <div id="team"></div>
  </div></aside>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PHASE_NAME = {longlist:"Gathering the longlist",screen:"Screening",checkpoint:"Waiting for you","deep-dive":"Deep dives",shortlist:"Building the shortlist",done:"Finished"};
const CRIT = [["spending","Proof of spending"],["gap","Gap"],["pain","Pain"],["reach","Reachability"],["build","Buildability"],["economics","Economics"]];
const TARGETS = {longlist:25, screened:8, shortlist:3};
let run = new URLSearchParams(location.search).get("run"), graph = null, ev = null;
const open = new Set();
const ago = iso => { const t = Date.parse(iso); if (isNaN(t)) return ""; const m = Math.round((Date.now()-t)/60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m/60)} h ${m%60} min ago`; };
const stateOf = n => n.state.startsWith("needs_input") ? "blocked" : n.state === "working" ? "working" : "idle";
const typing = () => { const a = document.activeElement; return a && a.tagName === "TEXTAREA"; };

// ---------- Evidence lookups (from the Run report's link check)
function evFor(id){
  if (!ev || !ev.results) return null;
  const mine = ev.results.filter(r => (r.niches||[]).includes(id));
  return {dead: mine.filter(r => r.verdict === "dead").length, ok: mine.filter(r => r.verdict === "ok").length,
          blocked: mine.filter(r => r.verdict === "blocked").length, none: (ev.unsupported||[]).some(u => u.id === id),
          deadUrls: new Set(mine.filter(r => r.verdict === "dead").map(r => r.url))};
}

// ---------- Funnel
function renderStages(d, funnel){
  // Each team's own funnel size: the tracker's "targets" if set, else by run name (money teams use 15 > 5 > 2).
  const byName = /^money/.test(run || "") ? {longlist:15, screened:5, shortlist:2} : {};
  const n = d.niches || [], t = Object.assign({}, TARGETS, byName, d.targets || {}), f = funnel || {};
  const nowScreened = n.filter(x => ["screened","shortlisted","finalist"].includes(x.stage)).length;
  let pi = ["longlist","screen","checkpoint","deep-dive","shortlist","done"].indexOf(d.phase);
  // A checkpoint after deep dives (OpenRig teams reuse "checkpoint") belongs to the deep-dive stage.
  const lateCheckpoint = d.phase === "checkpoint" && (f.deep_dive || 0) > 0;
  if (lateCheckpoint) pi = 3;
  const beyond = pi >= 3;
  const deep = beyond ? (f.deep_dive ?? (picker.order.length || nowScreened)) : 0;
  const counts = [Math.max(n.length, f.longlist||0), Math.max(nowScreened, f.screened||0), deep,
                  Math.max(n.filter(x => ["shortlisted","finalist"].includes(x.stage)).length, f.shortlist||0)];
  const active = pi <= 0 ? 0 : pi <= 2 ? 1 : pi === 3 ? 2 : pi === 4 ? 3 : 4;
  const st = [["Longlist","Candidates found",t.longlist],["Screened","Best of the longlist",t.screened],
              ["Deep dives","Chosen by you for a closer look",null],["Shortlist","Survived deep dives and the skeptic",t.shortlist]];
  $("stages").innerHTML = st.map(([name, sub, tgt], i) => {
    const waitAt = d.phase === "checkpoint" ? (lateCheckpoint ? 2 : 1) : -1;
    const cls = i === waitAt ? "waiting" : i === active ? "now" : i < active ? "done" : "";
    const tag = cls === "waiting" ? "Waiting for you" : cls === "now" ? "In progress" : cls === "done" ? "Done" : "Not started";
    const pct = tgt ? Math.min(100, counts[i]/tgt*100) : (cls === "done" || cls === "now" ? 100 : 0);
    return `<div class="stage ${cls}"><div class="top"><b>${name}</b><span class="tag">${tag}</span></div>
      <div class="big">${counts[i]}${tgt ? `<small> of ${tgt}</small>` : ""}</div><div class="meter"><i style="width:${pct}%"></i></div><div class="sub">${sub}</div></div>`;
  }).join("");
  const cut = n.filter(x => x.stage === "cut").length;
  $("cutline").innerHTML = cut ? `<b>${cut} cut</b>, each with its reason in the list at the bottom.` : "";
}

// ---------- Niches
const picker = { order: [], notes: {}, general: "", sent: null, loadedFor: null };
async function loadDecision(r){
  if (picker.loadedFor === r) return;
  Object.assign(picker, {loadedFor: r, order: [], notes: {}, general: "", sent: null});
  try { const x = await fetch(`/data/${encodeURIComponent(r)}/decision.json`, {cache:"no-store"});
    if (x.ok){ const j = await x.json(); Object.assign(picker, {order: j.deep_dive||[], notes: j.notes||{}, general: j.general_note||"", sent: {at: j.decided_at}}); } } catch {}
}
function glyph(s){ return `<span class="glyph" aria-hidden="true">${CRIT.map(([k]) => s?.[k] ? `<i style="height:${s[k]*3.6}px"></i>` : `<i class="none"></i>`).join("")}</span>`; }
function card(x, cls, picking){
  const isOpen = open.has(x.id), e = evFor(x.id), picked = picking && picker.order.includes(x.id);
  const total = x.total ?? Object.values(x.scores||{}).reduce((a,b)=>a+b,0);
  const badges = e ? [e.none ? `<span class="badge bad">No sources</span>` : "", e.dead ? `<span class="badge bad">${e.dead} dead link${e.dead>1?"s":""}</span>` : "",
    !e.none && !e.dead && e.ok ? `<span class="badge ok">${e.ok} sources checked</span>` : "", e.blocked ? `<span class="badge">${e.blocked} unverifiable</span>` : ""].join("") : "";
  const links = (x.evidence||[]).filter(u => /^https?:\/\//i.test(u)).map(u => `<a class="${e && e.deadUrls.has(u) ? "dead" : ""}" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,""))}</a>`).join("");
  const i = picker.order.indexOf(x.id);
  return `<article class="niche ${cls} ${isOpen?"open":""} ${picked?"picked":""}">
    <button aria-expanded="${isOpen}" data-id="${esc(x.id)}">
      <span class="nn">${esc(x.name)}</span>
      <span class="sig"><span class="tot">${total||"–"}<small>/30</small></span>${glyph(x.scores)}<span class="nid">${esc(x.id)}</span></span>
      <span class="nl">${esc(x.one_line)}</span>
      ${badges ? `<span class="badges">${badges}</span>` : ""}
    </button>
    <div class="detail">
      <div class="scores">${CRIT.map(([k,l]) => `<div>${l}<b>${x.scores?.[k] ?? "–"}</b></div>`).join("")}</div>
      ${x.reason ? `<p class="why">${esc(x.reason)}</p>` : ""}
      ${x.skeptic ? `<p class="skeptic"><b>Skeptic:</b> ${esc(x.skeptic)}</p>` : ""}
      ${links ? `<div class="src">${links}</div>` : `<div class="meta">No sources attached.</div>`}
      <div class="meta">${esc(x.owner||"")}${x.owner && x.updated ? ", " : ""}${x.updated ? `updated ${esc(ago(x.updated))}` : ""}</div>
    </div>
    ${picking && x.stage === "screened" ? `<div class="pick"><button class="pickbtn" data-pick="${esc(x.id)}" aria-pressed="${i>=0}">${i>=0 ? `Chosen #${i+1}` : "Choose"}</button>
      ${i>=0 ? `<textarea data-note="${esc(x.id)}" rows="1" placeholder="Note for the team (optional)">${esc(picker.notes[x.id]||"")}</textarea>` : ""}</div>` : ""}
  </article>`;
}
function renderNiches(d, force){
  if (!force && typing()) return;
  const n = (d.niches||[]).slice().sort((a,b)=>(b.total??0)-(a.total??0));
  const picking = d.phase === "checkpoint" && n.some(x => x.stage === "screened");
  const groups = [["Shortlist","short",x=>x.stage==="shortlisted"||x.stage==="finalist"],["Top 8","top",x=>x.stage==="screened"],["Under review","",x=>x.stage==="longlist"]];
  $("groups").innerHTML = groups.map(([t,c,f]) => { const items = n.filter(f); if (!items.length) return "";
    return `<section class="sec"><h3>${t}<span>${items.length}</span></h3><div class="cards">${items.map(x => card(x, c, picking)).join("")}</div></section>`; }).join("")
    || (n.length && n.every(x => x.stage === "cut")
        ? `<div class="sec outcome"><b>No niche survived this run.</b> All ${n.length} were cut; the reasons are in the list below. Read the team's <a href="/runs.html?run=${encodeURIComponent(run)}">summary and retro</a>, then decide what the next run should look for.</div>`
        : `<div class="sec empty">Niches appear here as the analysts report them.</div>`);
  const cuts = n.filter(x=>x.stage==="cut");
  $("cutCount").textContent = cuts.length; $("cutbox").style.display = cuts.length ? "" : "none";
  $("cuts").innerHTML = cuts.map(x=>`<div class="cutrow"><b>${esc(x.name)} <span>${esc(x.id)}</span></b><span>${esc(x.reason||"No reason recorded")}</span></div>`).join("");
  $("groups").querySelectorAll(".niche>button").forEach(b => b.onclick = () => { const id = b.dataset.id; open.has(id) ? open.delete(id) : open.add(id); b.parentElement.classList.toggle("open"); b.setAttribute("aria-expanded", open.has(id)); });
  $("groups").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const id = b.dataset.pick, i = picker.order.indexOf(id); i>=0 ? picker.order.splice(i,1) : picker.order.push(id); renderNiches(d, true); renderDecision(d); });
  $("groups").querySelectorAll("[data-note]").forEach(t => t.oninput = () => picker.notes[t.dataset.note] = t.value);
}
function renderDecision(d){
  const choosable = (d.niches||[]).some(x => x.stage === "screened");
  const show = (d.phase === "checkpoint" && choosable) || picker.sent, box = $("decision");
  box.classList.toggle("show", !!show); if (!show || typing()) return;
  const names = picker.order.map((id,i) => `${i+1}. ${(d.niches||[]).find(n=>n.id===id)?.name || id}`);
  const s = picker.sent;
  const line = s?.error ? `<span class="sent err">${esc(s.error)}</span>` : s ? `<span class="sent">Sent ${esc(ago(s.at))}${s.lead ? (s.lead_notified ? `, ${esc(s.lead.split("@")[0])} notified` : `. Couldn't message the lead; tell the operator it's in research/${esc(run)}/decision.md`) : ""}</span>` : "";
  box.innerHTML = `<div class="dl"><b>${picker.order.length ? `${picker.order.length} chosen` : "Choose the niches that should go further"}</b>
    <div class="order">${esc(names.join("   ")) || "The order you choose is the order the team works."}</div>
    <textarea id="generalNote" rows="2" placeholder="Anything else the team should know (optional)">${esc(picker.general)}</textarea>${line}</div>
    <button class="sendbtn" id="sendBtn" ${picker.order.length && d.phase === "checkpoint" ? "" : "disabled"}>${s && !s.error ? "Send updated decision" : "Send decision to the lead"}</button>`;
  $("generalNote").oninput = e => picker.general = e.target.value;
  $("sendBtn").onclick = async () => {
    $("sendBtn").disabled = true; $("sendBtn").textContent = "Sending…";
    try { const r = await (await fetch(`/api/decision?run=${encodeURIComponent(run)}`, {method:"POST", headers:{"Content-Type":"application/json","X-Rig-Console":"1"}, body: JSON.stringify({deep_dive: picker.order, notes: picker.notes, general_note: picker.general})})).json();
      picker.sent = r.error ? {error: r.error} : {at: r.decided_at, lead: r.lead, lead_notified: r.lead_notified}; } catch { picker.sent = {error: "Couldn't reach the dashboard server"}; }
    renderDecision(d);
  };
}

// ---------- Team column (same data and wording as the live graph)
function renderTeam(){
  if (!graph || !graph.nodes) return;
  const al = (graph.alerts||[]).filter(a => !a.dismissed);
  $("alerts").innerHTML = al.length ? al.map(a => `<a class="al ${a.severity==="warn"?"warn":""}" href="/graph.html?seat=${encodeURIComponent(a.node)}"><b>${esc(a.text)}</b></a>`).join("") : `<div class="allclear"><i></i>All clear</div>`;
  const groups = {}; graph.nodes.forEach(n => (groups[n.rig] ||= []).push(n));
  const order = Object.keys(groups).sort((a,b) => (a==="kernel") - (b==="kernel"));
  $("team").innerHTML = order.map(rig => { const ns = groups[rig], busy = ns.filter(n => stateOf(n) !== "idle").length;
    return `<div class="team"><div class="tn">${esc(rig)}<span>${busy ? `${busy} active` : "all idle"}</span></div>${ns.map(n => { const s = stateOf(n);
      const act = s === "idle" ? "Idle" : (n.action || "Working") + (n.elapsed && s === "working" ? `, ${n.elapsed.replace(/(\d+)m\s*\d+s/, "$1 min").replace(/^\d+s$/, "under a minute")}` : "");
      return `<a class="agent ${s}" href="/graph.html?seat=${encodeURIComponent(n.id)}" title="${esc(n.action||"")}"><span class="d"></span><b>${esc(n.name)}</b><span class="rt">${n.runtime==="claude-code"?"Claude":"Codex"}</span><span class="a">${esc(act)}</span></a>`; }).join("")}</div>`; }).join("");
  const blocked = graph.nodes.filter(n => stateOf(n) === "blocked");
  $("approve").classList.toggle("show", blocked.length > 0);
  $("approve").innerHTML = blocked.length ? `<div class="dot"></div><div><b>${blocked.map(n => esc(n.name)).join(", ")} ${blocked.length===1?"is":"are"} waiting for your approval</b><span>${esc(blocked[0].action || "")}<br>Approve in Ubuntu: <code>tmux attach -t '${esc(blocked[0].id)}'</code>, answer, then Ctrl+B, D.</span></div><a href="/graph.html?seat=${encodeURIComponent(blocked[0].id)}">Open in graph</a>` : "";
}

async function refresh(){
  let runs = [];
  try { runs = await (await fetch("/api/runs", {cache:"no-store"})).json(); } catch {}
  if (!run && runs.length) run = runs[runs.length-1].run;
  $("runSel").innerHTML = runs.map(r => `<option ${r.run===run?"selected":""}>${esc(r.run)}</option>`).join("") || "<option>No runs yet</option>";
  try { graph = await (await fetch("/api/graph", {cache:"no-store"})).json(); } catch {}
  renderTeam();
  if (!run){ $("title").textContent = "No research runs yet"; $("note").textContent = "Runs appear here once a lead writes research/<run>/niches.json."; return; }
  try { ev = await (await fetch(`/api/evidence?run=${encodeURIComponent(run)}`, {cache:"no-store"})).json(); } catch { ev = null; }
  let d;
  try { const r = await fetch(`/data/${encodeURIComponent(run)}/niches.json`, {cache:"no-store"}); if (!r.ok) throw 0; d = await r.json(); }
  catch { $("title").textContent = run; $("note").textContent = "Waiting for this run's tracker file."; return; }
  $("title").textContent = `${d.run || run}: ${PHASE_NAME[d.phase] || "Starting"}`;
  $("note").textContent = d.phase_note || "";
  $("fresh").textContent = d.updated ? `Tracker updated ${ago(d.updated)}` : "";
  const choosable = (d.niches||[]).some(x => x.stage === "screened");
  $("yourturn").classList.toggle("show", d.phase === "checkpoint");
  $("yourturn").innerHTML = `<div class="dot"></div><div><b>${choosable ? "Your turn: choose which niches go further" : "Your turn: the team is waiting at a checkpoint"}</b><span>${choosable ? "Choose cards below, add notes if you like, then send your decision at the bottom." : "There's nothing left to choose from. Read the team's summary, then tell the operator or lead what the next run should do."}</span></div>`;
  await loadDecision(run);
  renderStages(d, (runs.find(r => r.run === run) || {}).funnel); renderNiches(d); renderDecision(d);
}
$("runSel").onchange = e => { run = e.target.value; history.replaceState(null,"",`?run=${encodeURIComponent(run)}`); open.clear(); refresh(); };
refresh(); setInterval(refresh, 10000);
</script>
