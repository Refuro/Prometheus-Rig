<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9eef3; --surface:#f7f9fb; --raised:#fff; --ink:#152033; --muted:#5d687a; --faint:#8a94a4;
  --line:#d3dae3; --signal:#d38a00; --signal-soft:#fbefd6; --advance:#0e8a7d; --cut:#c2412b; --cut-soft:#f8e1dc;
  --edge:#b6c0cc; --hull:#dfe6ed;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0b111b; --surface:#121a26; --raised:#172131; --ink:#e5eaf1; --muted:#97a2b4; --faint:#66738a;
  --line:#243045; --signal:#f2b33d; --signal-soft:#3a2f17; --advance:#3cc2b2; --cut:#f0765c; --cut-soft:#3b1e19;
  --edge:#33425a; --hull:#141e2c;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100vh}
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:18px 24px 6px}
.bar h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em}
.bar nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.bar nav a:hover{color:var(--ink)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-left:auto}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.updated{font-size:13px;color:var(--faint)}
svg{flex:1;width:100%;height:100%;min-height:420px;display:block}
.hull{fill:var(--hull);stroke:var(--line)}
.hulltitle{font-weight:800;font-size:22px;fill:var(--ink);letter-spacing:-.01em}
.hullphase{font-size:16px;fill:var(--signal);font-weight:600}
.edge{fill:none;stroke:var(--edge);stroke-linecap:round}
.edge.active{stroke:var(--signal);stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.edge.stuck{stroke:var(--cut);stroke-dasharray:none;animation:none}
@keyframes flow{to{stroke-dashoffset:-28}}
.node{cursor:pointer}
.node .core{fill:var(--raised);stroke:var(--edge);stroke-width:2}
.node .role{font-size:14px;font-weight:700;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .halo{fill:none;stroke:transparent;stroke-width:10;opacity:.35}
.node.working .core{stroke:var(--signal);stroke-width:3}
.node.working .role{fill:var(--ink)}
.node.working .halo{stroke:var(--signal);animation:breathe 2.4s ease-in-out infinite}
.node.approval .core{stroke:var(--cut);stroke-width:3;fill:var(--cut-soft)}
.node.approval .role{fill:var(--cut)}
.node.approval .halo{stroke:var(--cut);opacity:.5;animation:breathe 1.2s ease-in-out infinite}
.node.frozen .core{stroke:var(--cut);stroke-dasharray:4 4}
.node.unknown .core{stroke-dasharray:2 4}
.node.sel .core{stroke-width:4}
@keyframes breathe{50%{stroke-width:18;opacity:.12}}
.nname,.nact,.badge{paint-order:stroke;stroke:var(--hull);stroke-width:6px;stroke-linejoin:round}
.nname{font-weight:700;font-size:17px;fill:var(--ink);text-anchor:middle}
.nact{font-size:15px;fill:var(--muted);text-anchor:middle}
.node.working .nact{fill:var(--ink)}
.node.approval .nact{fill:var(--cut);font-weight:600}
.badge{font-size:13px;fill:var(--faint);text-anchor:middle;font-weight:600}
@media (prefers-reduced-motion:reduce){.edge.active,.node .halo{animation:none!important}}

aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:22px 20px}
aside h2{font-size:15px;font-weight:700;margin:0 0 10px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.alert{all:unset;cursor:pointer;display:block;padding:10px 12px;border-radius:10px;background:var(--cut-soft);border:1px solid color-mix(in srgb,var(--cut) 35%,transparent)}
.alert b{display:block;color:var(--cut);font-size:14px}
.alert span{font-size:13px;color:var(--muted)}
.calm{font-size:14px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:24px}
.detail h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.detail .sub{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.now{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px;word-break:break-word}
.now.approval{border-color:var(--cut);color:var(--cut)}
.inbox{list-style:none;margin:0;padding:0;font-size:13.5px}
.inbox li{padding:8px 0;border-top:1px solid var(--line)}
.inbox li span{color:var(--muted)}
.attach{margin-top:16px;font-size:12.5px;color:var(--faint)}
.attach code{display:block;margin-top:4px;padding:8px 10px;background:var(--raised);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:12.5px;word-break:break-all;user-select:all}
.team .hull{cursor:grab}
.node{cursor:grab}
.edge.past{opacity:.55}
.tip{position:absolute;z-index:5;max-width:340px;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px color-mix(in srgb,#000 30%,transparent);pointer-events:none;font-size:13.5px}
.tip b{display:block;font-size:14.5px}
.tip p{margin:6px 0;word-break:break-word}
.tip small{color:var(--faint)}
.tipstate{font-size:12.5px;font-weight:650;color:var(--muted)}
.tipstate.working{color:var(--signal)} .tipstate.approval{color:var(--cut)}
.ghost{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:8px}
.ghost:hover{color:var(--ink)}
.ghost:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}aside{border-left:0;border-top:1px solid var(--line)}svg{min-height:560px}.legend{margin-left:0}}
</style>
<script src="/notify.js"></script>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stagebox">
    <div class="bar">
      <h1>Live graph</h1>
      <nav><a href="/">Niche board</a></nav>
      <button class="ghost" id="resetLayout" type="button" title="Forget dragged positions">Reset layout</button>
      <div class="legend" aria-label="Legend">
        <span><i style="background:var(--signal)"></i>Working</span>
        <span><i style="background:var(--cut)"></i>Needs you</span>
        <span><i style="background:var(--edge)"></i>Idle</span>
      </div>
      <div class="updated" id="updated"></div>
      <div id="alertSlot"></div>
    </div>
    <svg id="g" role="img" aria-label="Agent teams and the work moving between them"></svg>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside>
    <h2>Needs attention</h2>
    <div id="alerts"></div>
    <div class="detail" id="detail"></div>
  </aside>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PHASE = {longlist:"Gathering the longlist",screen:"Screening",checkpoint:"Waiting for you","deep-dive":"Deep dives",shortlist:"Shortlisting",done:"Finished"};
let data = null, selected = new URLSearchParams(location.search).get("seat"), layoutKey = "", pos = {}, box = {w:1200,h:700};

const cls = n => n.state.startsWith("needs_input") ? "approval" : n.alert==="frozen" ? "working frozen" : n.state==="working" ? "working" : n.state==="unknown" ? "unknown" : "idle";
const role = n => { const p = n.name.split("-"); const r = ["agent","lead","worker"].includes(p.at(-1)) && p.length>1 ? p[0] : p.at(-1); return r.length > 8 ? r.slice(0,7) : r; };
const isLead = n => /lead|operator/.test(n.name) && !/advisor/.test(n.name);
const runtimeName = r => r==="claude-code" ? "Claude" : r==="codex" ? "Codex" : r;
function wrap(text, max, lines=2){ const w = String(text||"").split(" "); const out=[""]; for (const x of w){ if ((out.at(-1)+" "+x).trim().length > max){ if (out.length===lines){ out[lines-1]=out[lines-1].slice(0,max-1)+"…"; return out;} out.push(x);} else out[out.length-1]=(out.at(-1)+" "+x).trim(); } return out; }
function mins(s){ if (s==null) return ""; const m=Math.round(s/60); return m<1?"under a minute":m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`; }

function layout(){
  // One constellation per team. Big teams: lead in the middle, members on a ring.
  // Teams of 2-3: a row. Largest team on the left, the rest stacked beside it.
  const groups = {};
  data.nodes.forEach(n => (groups[n.rig] ||= []).push(n));
  const order = Object.keys(groups).sort((a,b) => (a==="kernel") - (b==="kernel") || groups[b].length - groups[a].length);
  const key = order.map(r => r+":"+groups[r].map(n=>n.id).join(",")).join("|");
  if (key === layoutKey) return;
  layoutKey = key; pos = {};
  const clusters = order.map(rig => {
    const ns = groups[rig].slice().sort((a,b)=>isLead(b)-isLead(a));
    const ring = ns.length >= 4, R = ring ? 230 + Math.max(0, ns.length-6)*20 : 190;
    const w = ring ? 2*R + 300 : Math.max(420, (ns.length-1)*R + 300);
    const h = ring ? (ns.length <= 6 ? R + 380 : 2*R + 300) : 300;
    return {rig, ns, ring, R, w, h};
  });
  const gap = 28, pad = 20;
  const place = (c, x, y) => {
    c.x = x; c.y = y; c.cx = x + c.w/2; c.cy = y + (c.ring ? (c.ns.length <= 6 ? c.R + 120 : c.h/2 + 10) : 140);
    const [hub, ...rest] = c.ns;
    if (c.ring){
      // Up to 5 members fan out over the top half (left, up, right), leaving room
      // under the lead for what it's doing; bigger teams use the full circle.
      pos[hub.id] = {x: c.cx, y: c.cy};
      const arc = rest.length <= 5;
      rest.forEach((n,i) => {
        const a = arc ? Math.PI + (rest.length===1 ? Math.PI/2 : i*Math.PI/(rest.length-1))
                      : -Math.PI/2 + i*2*Math.PI/rest.length;
        pos[n.id] = {x: c.cx + c.R*Math.cos(a), y: c.cy + c.R*Math.sin(a)*(arc ? 0.85 : 1)}; });
    } else {
      // hub in the middle of the row, others alternating left and right of it
      const row = [hub]; rest.forEach((n,i) => i%2 ? row.push(n) : row.unshift(n));
      const x0 = c.cx - (row.length-1)*c.R/2;
      row.forEach((n,i) => pos[n.id] = {x: x0 + i*c.R, y: c.cy});
    }
  };
  const [first, ...others] = clusters;
  let colX = pad, colY = pad, colW = 0, maxH = 0, maxX = 0;
  if (first){ place(first, pad, pad); colX = pad + first.w + gap; maxH = first.h; maxX = colX; }
  const limit = Math.max(maxH, 660);
  for (const c of others){
    if (colY + c.h > pad + limit && colY > pad){ colX += colW + gap; colY = pad; colW = 0; }
    place(c, colX, colY); colY += c.h + gap; colW = Math.max(colW, c.w);
    maxH = Math.max(maxH, colY - gap - pad); maxX = Math.max(maxX, colX + colW);
  }
  box.w = Math.max(maxX, (first ? first.w : 0) + pad) + pad; box.h = maxH + 2*pad;
  data._clusters = clusters;
}

function edgePath(a, b, i){
  const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy)||1, r = 38;
  const sx = a.x + dx/d*r, sy = a.y + dy/d*r, ex = b.x - dx/d*(r+6), ey = b.y - dy/d*(r+6);
  const bend = (i%2?1:-1) * Math.min(60, d*0.18);
  const mx = (sx+ex)/2 - dy/d*bend, my = (sy+ey)/2 + dx/d*bend;
  return `M${sx},${sy} Q${mx},${my} ${ex},${ey}`;
}

// ---- Saved positions (per browser) so a layout you arrange by hand sticks.
const POSKEY = "rigGraphPositions";
const saved = (() => { try { return JSON.parse(localStorage.getItem(POSKEY)) || {}; } catch { return {}; } })();
const savePos = () => { try { localStorage.setItem(POSKEY, JSON.stringify(saved)); } catch {} };
let drag = null, vb = null;

function hullOf(rig){
  const ps = data.nodes.filter(n => n.rig === rig && pos[n.id]).map(n => pos[n.id]);
  const xs = ps.map(p=>p.x), ys = ps.map(p=>p.y);
  const x0 = Math.min(...xs) - 150, x1 = Math.max(...xs) + 150, y0 = Math.min(...ys) - 110, y1 = Math.max(...ys) + 160;
  return {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
}

function draw(){
  layout();
  for (const n of data.nodes) if (saved[n.id] && pos[n.id]) pos[n.id] = {...saved[n.id]};
  const g = $("g");
  const rigs = [...new Set(data.nodes.map(n=>n.rig))];
  const hulls = Object.fromEntries(rigs.map(r => [r, hullOf(r)]));
  if (!drag){
    const all = Object.values(hulls);
    const x0 = Math.min(...all.map(h=>h.x)) - 20, y0 = Math.min(...all.map(h=>h.y)) - 20;
    const x1 = Math.max(...all.map(h=>h.x+h.w)) + 20, y1 = Math.max(...all.map(h=>h.y+h.h)) + 20;
    vb = `${x0} ${y0} ${x1-x0} ${y1-y0}`;
  }
  g.setAttribute("viewBox", vb);
  const rigInfo = Object.fromEntries((data.rigs||[]).map(r=>[r.name,r]));
  let s = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--signal)"/></marker>
    <marker id="ah-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cut)"/></marker></defs>`;
  for (const r of rigs){
    const h = hulls[r], info = rigInfo[r] || {};
    s += `<g class="team" data-rig="${esc(r)}"><rect class="hull" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="28"><title>Drag to move the whole ${esc(r)} team</title></rect>
      <text class="hulltitle" x="${h.x+26}" y="${h.y+40}">${esc(r)}</text>
      ${info.phase ? `<text class="hullphase" x="${h.x+26}" y="${h.y+62}">${esc(PHASE[info.phase]||info.phase)}</text>` : ""}</g>`;
  }
  // Edges go under the nodes; idle history stays faint so live work stands out.
  (data.edges||[]).forEach((e,i) => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    const k = e.stuck ? "stuck" : e.active ? "active" : "past";
    const w = Math.min(4, 1.2 + Math.log2(e.total+1));
    s += `<path class="edge ${k}" d="${edgePath(a,b,i)}" stroke-width="${w}" marker-end="url(#${e.stuck?"ah-s":e.active?"ah-a":"ah"})"><title>${esc(e.from.split("@")[0])} to ${esc(e.to.split("@")[0])}: ${e.total} handoff${e.total===1?"":"s"}${e.active?`, ${e.active} open`:""}</title></path>`;
  });
  for (const n of data.nodes){
    const p = pos[n.id]; if (!p) continue;
    const c = cls(n);
    const showAct = c.includes("working") || c==="approval";
    const lines = showAct ? wrap(n.action || "Working", 34, 3) : [n.state==="idle" ? "Idle" : n.state==="unknown" ? "No activity signal" : n.state];
    s += `<g class="node ${c} ${n.id===selected?"sel":""}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}: ${esc(n.action || lines.join(" "))}">
      <circle class="halo" cx="${p.x}" cy="${p.y}" r="38"/>
      <circle class="core" cx="${p.x}" cy="${p.y}" r="33"/>
      <text class="role" x="${p.x}" y="${p.y}">${esc(role(n))}</text>
      <text class="nname" x="${p.x}" y="${p.y+56}">${esc(n.name)}</text>
      <text class="badge" x="${p.x}" y="${p.y+75}">${esc(runtimeName(n.runtime))}${n.work.length?` · ${n.work.length} in inbox`:""}</text>
      ${lines.map((l,i)=>`<text class="nact" x="${p.x}" y="${p.y+97+i*19}">${esc(l)}</text>`).join("")}
    </g>`;
  }
  g.innerHTML = s;
}

// ---- Hover card with the full text of what an agent is doing.
function showTip(id, ev){
  const n = data && data.nodes.find(x=>x.id===id), tip = $("tip");
  if (!n || drag){ tip.hidden = true; return; }
  const c = cls(n);
  tip.innerHTML = `<b>${esc(n.name)}</b><span class="tipstate ${c.split(" ")[0]}">${c==="approval"?"Waiting for approval":c.includes("frozen")?"Screen frozen":c==="working"?"Working":c==="idle"?"Idle":"No activity signal"}</span>
    <p>${esc(n.action || "Nothing on screen yet")}</p><small>Click for details, drag to move</small>`;
  tip.hidden = false;
  const r = $("stagebox").getBoundingClientRect();
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 16;
  x = Math.min(x, r.width - tip.offsetWidth - 12); y = Math.min(y, r.height - tip.offsetHeight - 12);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

// ---- Drag a node, or drag a team's background to move the whole team.
function svgPoint(ev){
  const g = $("g"), pt = g.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(g.getScreenCTM().inverse());
}
function wireGraph(){
  const g = $("g");
  g.addEventListener("pointerdown", ev => {
    const nodeEl = ev.target.closest(".node"), teamEl = ev.target.closest(".team");
    if (!nodeEl && !teamEl) return;
    const p = svgPoint(ev);
    const ids = nodeEl ? [nodeEl.dataset.id] : data.nodes.filter(n=>n.rig===teamEl.dataset.rig).map(n=>n.id);
    drag = {ids, start: p, orig: Object.fromEntries(ids.map(id=>[id,{...pos[id]}])), moved: false, node: nodeEl && nodeEl.dataset.id};
    $("tip").hidden = true;
    ev.preventDefault();
  });
  window.addEventListener("pointermove", ev => {
    if (!drag){
      const nodeEl = ev.target.closest && ev.target.closest(".node");
      nodeEl ? showTip(nodeEl.dataset.id, ev) : ($("tip").hidden = true);
      return;
    }
    const p = svgPoint(ev), dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    if (Math.hypot(dx,dy) > 4) drag.moved = true;
    if (!drag.moved) return;
    drag.ids.forEach(id => { pos[id] = {x: drag.orig[id].x + dx, y: drag.orig[id].y + dy}; saved[id] = pos[id]; });
    draw();
  });
  window.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved){ savePos(); draw(); }
    else if (d.node){ selected = d.node; history.replaceState(null,"",`?seat=${encodeURIComponent(selected)}`); draw(); side(); }
  });
  g.addEventListener("keydown", e => {
    const el = e.target.closest(".node");
    if (el && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); selected = el.dataset.id; draw(); side(); }
  });
  $("resetLayout").onclick = () => { Object.keys(saved).forEach(k => delete saved[k]); savePos(); layoutKey = ""; draw(); };
}

function side(){
  const al = data.alerts || [];
  $("alerts").innerHTML = al.length
    ? `<div class="alerts">${al.map(a=>`<button class="alert" data-node="${esc(a.node)}"><b>${esc(a.text)}</b>${a.detail?`<span>${esc(a.detail)}</span>`:""}</button>`).join("")}</div>`
    : `<div class="calm">Nothing is stuck. Agents waiting for approval, frozen screens and unclaimed handoffs show up here.</div>`;
  $("alerts").querySelectorAll(".alert").forEach(b => b.onclick = () => { selected = b.dataset.node; draw(); side(); });
  const n = data.nodes.find(x=>x.id===selected) || data.nodes.find(x=>x.alert) || data.nodes.find(isLead) || data.nodes[0];
  if (!n){ $("detail").innerHTML = ""; return; }
  const c = cls(n);
  const stateText = c==="approval" ? "Waiting for approval" : c.includes("frozen") ? "Working, screen frozen" : c==="working" ? "Working" : c==="idle" ? "Idle" : "No activity signal";
  $("detail").innerHTML = `<h3>${esc(n.name)}</h3>
    <div class="sub">${esc(n.rig)} team, ${esc(runtimeName(n.runtime))}${n.model?` (${esc(n.model)})`:""}</div>
    <dl class="kv"><dt>State</dt><dd>${stateText}</dd><dt>Screen last changed</dt><dd>${n.unchanged_s==null?"unknown":n.unchanged_s<20?"just now":mins(n.unchanged_s)+" ago"}</dd></dl>
    <div class="now ${c==="approval"?"approval":""}">${esc(n.action || "Nothing on screen yet")}</div>
    <h2>Inbox</h2>
    ${n.work.length ? `<ul class="inbox">${n.work.map(w=>`<li><b>${esc(w.state)}</b> from ${esc((w.from||"").split("@")[0])} <span>${mins(w.age_s)} ago${w.tags.length?`, ${esc(w.tags.join(", "))}`:""}</span></li>`).join("")}</ul>` : `<div class="calm" style="margin:0">No open work.</div>`}
    <div class="attach">Talk to it in Ubuntu<code>tmux attach -t '${esc(n.id)}'</code></div>`;
}

async function refresh(){
  try { data = await (await fetch("/api/graph",{cache:"no-store"})).json(); }
  catch { $("updated").textContent = "Can't reach the dashboard server"; return; }
  if (data.error){ $("updated").textContent = data.error; return; }
  $("updated").textContent = `${data.nodes.length} agents, ${(data.alerts||[]).length} need attention`;
  draw(); side();
}
wireGraph(); refresh(); setInterval(() => { if (!drag) refresh(); }, 5000);
</script>
</body>
</html>
