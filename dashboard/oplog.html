<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f17" media="(prefers-color-scheme: dark)">
<title>Operator log · Rig Console</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Operator log (R-022, PL-031): what the operator did, newest first. The log is agent-written, so every
     part is shown as plain text (escaped). Read-only; it never notifies or counts anything. -->
<style>
:root{
  --paper:#eef1f4; --surface:#f7f9fb; --raised:#fff; --ink:#152033; --muted:#5d687a; --faint:#8a94a4;
  --line:#d7dde5; --signal:#c98200; --signal-soft:#fbf0d9; --cut:#c2412b; --ok:#2e9d62;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0a0f17; --surface:#0f1621; --raised:#141d2a; --ink:#e3e8ef; --muted:#8e9aac; --faint:#5d6a7e;
  --line:#212c3c; --signal:#f0b23c; --signal-soft:#2f2511; --cut:#f0765c; --ok:#3cb371;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.months{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.months a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--raised)}
.months a[aria-current="page"]{color:var(--ink);border-color:var(--signal)}
h2{margin:18px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day{background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.e{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 13px;border-top:1px solid var(--line)}
.e:first-child{border-top:0}
.t{font:12.5px/1.6 var(--mono);color:var(--faint)}
.k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--muted);margin-right:6px;vertical-align:1px}
.k.incident{color:var(--cut)} .k.held{color:var(--signal);background:var(--signal-soft)} .k.outcome{color:var(--ok)}
.x{overflow-wrap:anywhere}
.ref{grid-column:2;font:12px/1.45 var(--mono);color:var(--faint);overflow-wrap:anywhere}
.empty{color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
</style>
</head>
<body>
<script src="/nav.js"></script>
<main>
  <h1>Operator log</h1>
  <div class="sub">What the operator did, and why, newest first. It's a record: nothing here needs you, and it never notifies.</div>
  <nav class="months" id="months" aria-label="Month"></nav>
  <div id="log"><div class="empty">Loading…</div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTH = new URLSearchParams(location.search).get("month") || "";
const label = m => { try { return new Date(m + "-01T12:00:00Z").toLocaleDateString([], {month: "long", year: "numeric"}); } catch { return m; } };
async function load(){
  let d;
  try {
    const r = await fetch("/api/oplog" + (MONTH ? "?month=" + encodeURIComponent(MONTH) : ""), {cache: "no-store"});
    if (r.status === 404) { $("log").innerHTML = `<div class="empty">The operator log arrives with the next console update.</div>`; return; }
    d = await r.json();
  } catch { $("log").innerHTML = `<div class="empty">Couldn't reach the console.</div>`; return; }
  const ms = d.months || [];
  $("months").innerHTML = ms.length > 1 ? ms.map(m => `<a href="/oplog.html?month=${encodeURIComponent(m)}"${m === d.month ? ' aria-current="page"' : ""}>${esc(label(m))}</a>`).join("") : "";
  if (d.error) { $("log").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  const days = d.days || [];
  $("log").innerHTML = days.length ? days.map(day => `<h2>${esc(day.day)}</h2><div class="day">${day.entries.map(e => `<div class="e">
      <span class="t">${esc(e.time || "")}</span>
      <span class="x">${e.kind ? `<span class="k ${esc(e.kind)}">${esc(e.kind)}</span>` : ""}${esc(e.text)}</span>
      ${e.ref ? `<span class="ref">ref: ${esc(e.ref)}</span>` : ""}</div>`).join("")}</div>`).join("")
    : `<div class="empty">No operator log yet.</div>`;
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
